<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SceneMaterial — hatch patterns on triangle surfaces</title>
  <link href="../../../../css/example-page.css" rel="stylesheet"/>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
    }
    body {
      background-color: #f6f7f9;
      overflow: hidden;
      margin: 0;
      user-select: none;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #111;
    }
    #demoCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: white;
      border: 0;
    }
    #controls {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 2;
      max-width: min(320px, calc(100vw - 32px));
      padding: 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.16);
      font: 13px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #controls fieldset {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      padding: 0;
      margin: 0;
      border: 0;
    }
    #controls legend {
      width: 100%;
      margin-bottom: 2px;
      font-weight: 650;
    }
    #controls label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    #status {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 2;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.92);
      color: #1f2933;
      font: 13px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.16);
    }
    #status[data-state="error"] {
      color: #8a1f17;
    }
  </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="controls"></div>
<div id="status">Loading hatch patterns</div>
<script type="module" src="./index.js"></script>
</body>
</html>
