<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SceneModel Lifecycle Batches</title>
  <link href="../../../../css/example-page.css" rel="stylesheet"/>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f3f5f7;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1d232b;
      isolation: isolate;
    }

    body > canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f3f5f7;
      z-index: 0 !important;
    }

    #panel {
      position: fixed;
      top: 16px;
      left: 16px;
      width: min(390px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid rgba(36, 43, 54, 0.16);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 14px 32px rgba(20, 25, 35, 0.16);
      backdrop-filter: blur(10px);
      z-index: 2147483647;
      pointer-events: auto;
    }

    #panel h1 {
      margin: 0 0 12px;
      font-size: 17px;
      line-height: 1.2;
      font-weight: 650;
    }

    #controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      min-height: 34px;
      border: 1px solid #b8c0ca;
      border-radius: 6px;
      background: #fff;
      color: #1d232b;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #eef3f8;
    }

    button:disabled {
      color: #8993a0;
      cursor: default;
      background: #f5f7f9;
    }

    #sealBtn {
      border-color: #9f7f31;
      background: #fff7dc;
    }

    #resetBtn {
      border-color: #9fa8b3;
    }

    #stats {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
      font-size: 12px;
      line-height: 1.35;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 3px 0;
      border-bottom: 1px solid rgba(36, 43, 54, 0.08);
    }

    .row span:first-child {
      color: #5b6572;
    }

    .row span:last-child {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    #log {
      margin-top: 12px;
      padding: 8px;
      min-height: 34px;
      border-radius: 6px;
      background: #202832;
      color: #eef3f8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.35;
      white-space: pre-wrap;
    }
  </style>
</head>
<body class="xeokit-loading-spinner-ready">
<canvas id="demoCanvas"></canvas>
<section id="panel">
  <h1>SceneModel Lifecycle Batches</h1>
  <div id="controls">
    <button id="stageBtn" type="button">Stage batch</button>
    <button id="commitBtn" type="button">Commit batch</button>
    <button id="rollbackBtn" type="button">Rollback batch</button>
    <button id="sealBtn" type="button">Seal model</button>
    <button id="attemptBtn" type="button">Attempt add</button>
    <button id="resetBtn" type="button">Reset</button>
  </div>
  <div id="stats"></div>
  <div id="log">Ready</div>
</section>
<script type="module" src="./index.js"></script>
</body>
</html>
