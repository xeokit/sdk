<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scene Health × Data Health — Showcase</title>
  <style>
    body {
      background-color: white;
      margin: 0;
      overflow: hidden;
      user-select: none;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    #demoCanvas {
      position: absolute;
      inset: 0;
      background: white;
      border: 0;
    }

    /* Tiny intro card — explains what's loaded so a first-time
       viewer understands the deliberately-broken model is the
       point. */
    #intro {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 580px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 6px;
      color: #333;
      font-size: 12px;
      line-height: 1.45;
      z-index: 10;
    }
    #intro strong { color: #111; }
    #intro .pill {
      display: inline-block;
      padding: 1px 6px;
      margin: 0 2px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
    }
    #intro .pill.scene { background: #e2ecf3; color: #2d5e8c; }
    #intro .pill.data  { background: #def0eb; color: #2c7e6f; }
  </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="intro">
  Synthetic factory built with deliberate flaws across both inspectors.
  <span class="pill scene">Scene Health</span> opens on the right;
  <span class="pill data">Data Health</span> opens on the left.
  Drag, expand, and toggle inspections to explore — every flagged
  issue traces back to a single line in this example's <code>index.js</code>.
</div>
<script type="module" src="./index.js"></script>
</body>
</html>
