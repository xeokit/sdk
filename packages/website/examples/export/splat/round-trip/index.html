<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3D Gaussian Splatting Round-Trip — Load, Export, Re-Import (.splat)</title>
    <link href="../../../../css/example-loading.css" rel="stylesheet"/>
    <style>
        body { background-color: black; overflow: hidden; margin: 0; user-select: none; }
        #demoCanvas { width: 100%; height: 100%; position: absolute; background: black; border: 0; }
        #status {
            position: absolute; top: 12px; left: 12px; padding: 6px 12px;
            background: rgba(0, 0, 0, 0.6); color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 13px; border-radius: 6px;
        }
        #caption {
            display: none; position: absolute; bottom: 12px; left: 12px; max-width: 520px;
            padding: 8px 12px; background: rgba(0, 0, 0, 0.6); color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 12px; line-height: 1.5; border-radius: 6px;
        }
    </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="status">Loading…</div>
<div id="caption">
    Loads a <code>.splat</code> capture, exports it with
    <code>GaussianSplatExporter</code>, then re-imports the result. Drag to orbit,
    scroll to zoom, right-drag to pan.
</div>
</body>
<script type="module" src="./index.js"></script>
</html>
