<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Viewing an AutoCAD DXF Drawing</title>
    <style>
        body { background-color: #f4f4f4; overflow: hidden; margin: 0; user-select: none; }
        #demoCanvas { width: 100%; height: 100%; position: absolute; background: #f4f4f4; border: 0; }
        #info {
            position: absolute; top: 120px; left: 10px; padding: 10px 12px;
            background: rgba(255, 255, 255, 0.92); color: #222;
            font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
            border-radius: 6px; max-width: 540px; line-height: 1.45;
            pointer-events: none; z-index: 200000;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }
        #info b { color: #2a7a2a; }
        #info .fail { color: #b03030; }
        #info .muted { color: #888; }
    </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="info">Parsing inline DXF text via mini parser …</div>
</body>
<script type="module" src="./index.js"></script>
</html>
