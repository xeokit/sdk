<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bare-Bones Model File Drop</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #f5f7fa;
            color: #111827;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #demoCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            border: 0;
            background: #f5f7fa;
        }

        #dropOverlay {
            position: fixed;
            inset: 0;
            z-index: 2147483646;
            display: grid;
            place-items: center;
            pointer-events: none;
            border: 0 solid transparent;
            transition: background 120ms ease, border-width 120ms ease;
        }

        #dropOverlay[data-active="true"] {
            border-width: 8px;
            border-color: rgba(37, 99, 235, 0.75);
            background: rgba(37, 99, 235, 0.10);
        }

        #prompt {
            max-width: min(560px, calc(100vw - 32px));
            padding: 18px 20px;
            border: 1px solid rgba(15, 23, 42, 0.16);
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
            line-height: 1.45;
        }

        #prompt strong {
            display: block;
            margin-bottom: 6px;
            font-size: 15px;
        }

        #prompt span {
            display: block;
            color: #475569;
            font-size: 13px;
        }

        #status {
            position: fixed;
            left: 14px;
            top: 14px;
            z-index: 2147483647;
            max-width: min(520px, calc(100vw - 28px));
            padding: 10px 12px;
            border: 1px solid rgba(15, 23, 42, 0.18);
            background: rgba(255, 255, 255, 0.94);
            color: #1f2937;
            font-size: 13px;
            line-height: 1.45;
        }

        #status[data-state="ok"] {
            border-color: rgba(22, 163, 74, 0.45);
        }

        #status[data-state="error"] {
            border-color: rgba(220, 38, 38, 0.55);
            color: #991b1b;
        }

        #progressPanel {
            position: fixed;
            left: 14px;
            top: 72px;
            z-index: 2147483647;
            display: none;
            width: min(420px, calc(100vw - 28px));
            padding: 10px 12px;
            border: 1px solid rgba(15, 23, 42, 0.14);
            background: rgba(255, 255, 255, 0.94);
            color: #334155;
            font-size: 12px;
            line-height: 1.35;
        }

        #progressPanel[data-visible="true"] {
            display: block;
        }

        #progressTrack {
            position: relative;
            height: 6px;
            margin-top: 8px;
            overflow: hidden;
            background: #dbe3ed;
        }

        #progressBar {
            width: 0;
            height: 100%;
            background: #2563eb;
            transition: width 120ms ease;
        }

        #progressPanel[data-indeterminate="true"] #progressBar {
            position: absolute;
            width: 34%;
            animation: progress-slide 1.1s ease-in-out infinite;
        }

        #fpsMeter {
            position: fixed;
            right: 14px;
            top: 14px;
            z-index: 2147483647;
            min-width: 122px;
            padding: 8px 10px;
            border: 1px solid rgba(15, 23, 42, 0.18);
            background: rgba(17, 24, 39, 0.88);
            color: #f8fafc;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            line-height: 1.35;
            pointer-events: none;
        }

        #fpsMeter strong {
            display: block;
            font-size: 17px;
            line-height: 1.1;
            font-weight: 650;
        }

        #fpsMeter span {
            display: block;
            color: #cbd5e1;
            white-space: nowrap;
        }

        @keyframes progress-slide {
            0% {
                left: -36%;
            }
            100% {
                left: 102%;
            }
        }
    </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="dropOverlay">
    <div id="prompt">
        <strong>Drop a model file onto the canvas</strong>
        <span>Supported single-file formats: XGF, XKT, GLB, glTF, IFC, dotBIM, LAS/LAZ, PLY, FBX, USDZ, CityJSON, DXF, DWG, 3DXML, SPLAT.</span>
    </div>
</div>
<div id="status">Initializing viewer...</div>
<div id="progressPanel">
    <div id="progressLabel">Loading...</div>
    <div id="progressTrack"><div id="progressBar"></div></div>
</div>
<div id="fpsMeter">
    <strong id="fpsValue">-- FPS</strong>
    <span id="frameMsValue">-- ms/frame</span>
    <span id="rafValue">-- RAF</span>
</div>
</body>
<script type="module" src="./index.js"></script>
</html>
