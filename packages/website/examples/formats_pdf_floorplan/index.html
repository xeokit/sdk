<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Importing a PDF drawing</title>
    <link href="../../css/example-page.css" rel="stylesheet"/>
    <style>
        body {
            background-color: white;
            overflow: hidden;
            margin: 0;
            user-select: none;
        }
        #demoCanvas {
            width: 100%;
            height: 100%;
            position: absolute;
            background: white;
            border: 0;
        }
    </style>
    <!--
      PDF.js is *not* bundled with the xeokit SDK — bring your own.
      pdfjs-dist 4.x ships ESM-only, so the example imports it
      directly from a CDN inside index.js (no script tag here). In a
      production app you'd vend pdf.js + its worker from your own
      origin and pin a known-good version.
    -->
</head>
<body>
<canvas id="demoCanvas"></canvas>
</body>
<script type="module" src="./index.js"></script>
</html>
