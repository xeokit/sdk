<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Viewing 3D Tiles Feature Metadata</title>
    <link href="../../css/example-loading.css" rel="stylesheet"/>
    <style>
        body { background-color: #0f1417; overflow: hidden; margin: 0; user-select: none; }
        #demoCanvas { width: 100%; height: 100%; position: absolute; background: #0f1417; border: 0; }
        #panel {
            position: absolute; top: 12px; left: 12px; width: min(390px, calc(100vw - 24px));
            padding: 12px; background: rgba(15, 20, 23, 0.84); color: #f3f7f8;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 13px; border-radius: 6px; box-sizing: border-box;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.34);
            backdrop-filter: blur(8px);
        }
        #status { font-weight: 650; margin-bottom: 10px; }
        .eyebrow { color: #9db1b8; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
        .metrics {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px;
        }
        .metric {
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 5px;
            padding: 7px 8px; background: rgba(255, 255, 255, 0.06);
        }
        .metric strong { display: block; font-size: 17px; line-height: 1; margin-bottom: 4px; }
        .metric span { color: #b7c3c7; font-size: 11px; }
        #featureList { display: grid; gap: 6px; margin-bottom: 10px; }
        .featureButton {
            display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center;
            width: 100%; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 5px;
            padding: 8px; background: rgba(255, 255, 255, 0.06); color: inherit;
            font: inherit; text-align: left; cursor: pointer;
        }
        .featureButton:hover,
        .featureButton.selected {
            border-color: rgba(255, 255, 255, 0.34); background: rgba(255, 255, 255, 0.13);
        }
        .swatch { width: 18px; height: 18px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.34); }
        .featureName { font-weight: 650; }
        .featureVector { color: #b7c3c7; font-variant-numeric: tabular-nums; font-size: 12px; }
        .linkBadge {
            border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 4px; padding: 2px 5px;
            color: #c9d4d8; background: rgba(255, 255, 255, 0.07); font-size: 11px;
        }
        #details {
            border-top: 1px solid rgba(255, 255, 255, 0.12); padding-top: 10px;
            color: #d9e2e5; line-height: 1.4;
        }
        .detailHeader { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .detailTitle { font-weight: 700; }
        .bars { display: grid; gap: 5px; margin: 9px 0; }
        .bar { display: grid; grid-template-columns: 74px 1fr 36px; gap: 7px; align-items: center; font-size: 12px; }
        .barTrack { height: 7px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
        .barFill { height: 100%; border-radius: 2px; }
        .barValue { color: #c4d0d4; text-align: right; font-variant-numeric: tabular-nums; }
        #details code { color: #fff; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="panel">
    <div class="eyebrow">EXT_mesh_features</div>
    <div id="status">Loading...</div>
    <div class="metrics">
        <div class="metric"><strong id="featureCount">-</strong><span>features</span></div>
        <div class="metric"><strong id="objectCount">-</strong><span>scene links</span></div>
        <div class="metric"><strong id="tableCount">-</strong><span>property sets</span></div>
    </div>
    <div id="featureList"></div>
    <div id="details">Select a feature block or row.</div>
</div>
</body>
<script type="module" src="./index.js"></script>
</html>
