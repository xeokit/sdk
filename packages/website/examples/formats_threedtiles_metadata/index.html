<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Viewing 3D Tiles Metadata</title>
    <link href="../../css/example-loading.css" rel="stylesheet"/>
    <style>
        body { background-color: black; overflow: hidden; margin: 0; user-select: none; }
        #demoCanvas { width: 100%; height: 100%; position: absolute; z-index: 0; background: black; border: 0; }
        #panel {
            position: absolute; top: 12px; left: 12px; width: min(420px, calc(100vw - 24px));
            z-index: 200000001;
            max-height: calc(100vh - 24px); overflow: auto;
            padding: 12px; background: rgba(9, 13, 17, 0.78); color: #f5f7fa;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 13px; border-radius: 6px; box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        }
        #status { color: #aeb8c4; margin-bottom: 10px; }
        .heading { font-size: 11px; line-height: 1; color: #8fa0b3; text-transform: uppercase; margin: 14px 0 7px; }
        .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .metric { background: rgba(255, 255, 255, 0.08); border-radius: 4px; padding: 8px; min-width: 0; }
        .metric strong { display: block; font-size: 16px; line-height: 1.1; color: #fff; }
        .metric span { display: block; margin-top: 4px; color: #aeb8c4; overflow-wrap: anywhere; }
        .groups { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .group { display: flex; gap: 8px; align-items: center; background: rgba(255, 255, 255, 0.08); border-radius: 4px; padding: 8px; min-width: 0; }
        .swatch { width: 14px; height: 14px; border-radius: 3px; flex: 0 0 auto; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35); }
        .group div:last-child { min-width: 0; overflow-wrap: anywhere; }
        .tiles { display: grid; gap: 6px; }
        .tileButton {
            display: grid; grid-template-columns: 1fr auto; gap: 6px; width: 100%; min-height: 42px;
            padding: 8px 9px; color: #f5f7fa; background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 4px; text-align: left;
            font: inherit; cursor: pointer;
        }
        .tileButton:hover, .tileButton.selected { background: rgba(74, 144, 226, 0.24); border-color: rgba(124, 179, 255, 0.7); }
        .tileButton b { display: block; font-size: 13px; line-height: 1.2; }
        .tileButton span { color: #aeb8c4; }
        .tileButton em { color: #d6e5f5; font-style: normal; align-self: center; }
        #details {
            margin: 8px 0 0; padding: 10px; background: rgba(0, 0, 0, 0.28);
            border-radius: 4px; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px; line-height: 1.45; overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="panel">
    <div id="status">Loading...</div>
    <div class="heading">Tileset Metadata</div>
    <div class="summary" id="summary"></div>
    <div class="heading">Content Groups</div>
    <div class="groups" id="groups"></div>
    <div class="heading">Tile Metadata</div>
    <div class="tiles" id="tiles"></div>
    <div class="heading">Selected Record</div>
    <pre id="details"></pre>
</div>
</body>
<script type="module" src="./index.js"></script>
</html>
