<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XGF Streamed Stadium</title>
  <link rel="icon" href="data:,">
  <link href="../../css/example-page.css" rel="stylesheet"/>
  <style>
    body {
      background: #9ec9ee;
      overflow: hidden;
      margin: 0;
      user-select: none;
      font-family: Arial, sans-serif;
    }

    #demoCanvas {
      width: 100%;
      height: 100%;
      position: absolute;
      background: linear-gradient(#82b9ed 0%, #cfe3f4 58%, #eef2f3 100%);
      border: 0;
    }

    .xeokit-loading-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(7, 10, 18, 0.32);
      z-index: 2000000;
    }

    .xeokit-loading-card {
      min-width: 280px;
      width: min(420px, calc(100vw - 48px));
      padding: 20px 22px 18px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(20,24,36,0.96), rgba(11,14,22,0.96));
      box-shadow: 0 18px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
      border: 1px solid rgba(120, 160, 255, 0.18);
      text-align: center;
      color: #e8eefc;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .xeokit-loading-text {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #f4f7ff;
    }

    .xeokit-loading-subtext {
      font-size: 12px;
      line-height: 1.4;
      color: rgba(225, 234, 255, 0.72);
      margin-bottom: 12px;
      min-height: 17px;
    }

    .xeokit-loading-progress-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.08);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.35);
    }

    .xeokit-loading-progress-fill {
      width: 25%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #4f8cff, #7db6ff);
      box-shadow: 0 0 16px rgba(87, 151, 255, 0.5);
    }

    .xkt-info-panel,
    .xkt-info-pill {
      display: none !important;
    }

    #streamPanel {
      position: fixed !important;
      top: 44px !important;
      right: 16px !important;
      width: min(450px, calc(100vw - 32px));
      max-height: calc(100vh - 68px);
      overflow: auto;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(35, 43, 52, 0.18);
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(30, 38, 48, 0.18);
      color: #1f2933;
      z-index: 2147483647;
    }

    .panel-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(35, 43, 52, 0.12);
    }

    .panel-header h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 700;
    }

    .panel-header p {
      margin: 6px 0 0;
      font-size: 12px;
      line-height: 1.4;
      color: #52606d;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px 16px;
    }

    .metric {
      min-height: 50px;
      border: 1px solid rgba(35, 43, 52, 0.12);
      border-radius: 7px;
      background: #f8fafb;
      padding: 8px;
    }

    .metric strong {
      display: block;
      font-size: 17px;
      line-height: 1.1;
    }

    .metric span {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      color: #65717d;
    }

    .queue-progress {
      margin: 0 16px 14px;
      padding: 12px;
      border: 1px solid rgba(35, 43, 52, 0.12);
      border-radius: 7px;
      background: #f8fafb;
    }

    .queue-progress label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
      color: #65717d;
    }

    .queue-progress strong {
      font-size: 12px;
      color: #26313b;
      font-weight: 650;
      white-space: nowrap;
    }

    .queue-progress input {
      display: block;
      width: 100%;
      height: 8px;
      margin: 12px 0 0;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #6f8798 var(--progress, 0%), #dce3e8 var(--progress, 0%));
      appearance: none;
      -webkit-appearance: none;
      pointer-events: none;
    }

    .queue-progress input::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 0;
      height: 0;
      border: 0;
    }

    .queue-progress input::-moz-range-thumb {
      width: 0;
      height: 0;
      border: 0;
    }

    .queue-progress input::-moz-range-track {
      height: 8px;
      border: 0;
      border-radius: 999px;
      background: transparent;
    }

    .queue-progress[data-mode="pending"] input {
      --progress: 35%;
      background: linear-gradient(90deg, #dce3e8 0%, #6f8798 35%, #dce3e8 70%);
    }

    .issue-list {
      padding: 0 16px 16px;
    }

    .issue-list h2 {
      margin: 4px 0 8px;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 700;
      color: #26313b;
    }

    .issue-card {
      display: block;
      width: 100%;
      min-height: 56px;
      margin: 0 0 8px;
      padding: 9px 10px;
      text-align: left;
      background: #f8fafb;
      border: 1px solid rgba(35, 43, 52, 0.14);
      border-radius: 7px;
      color: #1f2933;
      cursor: pointer;
    }

    .issue-card.has-thumbnail {
      display: grid;
      grid-template-columns: 160px minmax(0, 1fr);
      column-gap: 12px;
      align-items: center;
      min-height: 122px;
      padding: 9px 10px 9px 9px;
    }

    .issue-thumbnail {
      grid-row: 1 / span 3;
      width: 160px;
      height: 106px;
      border: 1px solid rgba(35, 43, 52, 0.16);
      border-radius: 5px;
      background: #d9e2e8;
    }

    .issue-card:hover,
    .issue-card:focus-visible {
      border-color: rgba(70, 94, 112, 0.44);
      background: #eef4f7;
      outline: none;
    }

    .issue-card[aria-pressed="true"] {
      border-color: #6f8798;
      box-shadow: inset 3px 0 0 #6f8798;
      background: #eef4f7;
    }

    .issue-card strong {
      display: block;
      min-width: 0;
      font-size: 12px;
      line-height: 1.25;
      font-weight: 700;
    }

    .issue-card span {
      display: block;
      min-width: 0;
      margin-top: 3px;
      font-size: 11px;
      line-height: 1.3;
      color: #5f6f7c;
    }

    .issue-card em {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 6px;
      border-radius: 999px;
      background: #dbeaf6;
      color: #36566f;
      font-style: normal;
      font-size: 10px;
      line-height: 1.2;
      font-weight: 700;
    }
  </style>
</head>
<body>
<div id="xeokit-boot-loading-overlay" class="xeokit-loading-overlay" style="display: flex;">
  <div class="xeokit-loading-card" role="progressbar" aria-valuemin="0" aria-valuenow="0">
    <div class="xeokit-loading-text">Booting Baku stream</div>
    <div class="xeokit-loading-subtext">Preparing scene...</div>
    <div class="xeokit-loading-progress-track">
      <div class="xeokit-loading-progress-fill"></div>
    </div>
  </div>
</div>
<canvas id="demoCanvas"></canvas>
<div id="streamPanel">
  <div class="panel-header">
    <h1>XGF Streamed Stadium</h1>
    <p>Streams only the objects visible from each selected issue viewpoint, so reviewers can inspect shared context before the whole model loads.</p>
  </div>
  <div class="metrics">
    <div class="metric"><strong id="loadedChunks">0</strong><span>loaded chunks</span></div>
    <div class="metric"><strong id="objectCount">0</strong><span>objects</span></div>
    <div class="metric"><strong id="meshCount">0</strong><span>meshes</span></div>
  </div>
  <div class="queue-progress" data-mode="pending">
    <label for="frustumQueueProgress">
      <span>Frustum chunks loaded</span>
      <strong id="frustumQueueLabel">Preparing stream...</strong>
    </label>
    <input id="frustumQueueProgress" type="range" min="0" max="1" value="0" disabled>
  </div>
  <div class="issue-list">
    <h2>Simulated BCF Issues</h2>
    <div id="issueCards"></div>
  </div>
</div>
</body>
<script type="module" src="./index.js"></script>
</html>
