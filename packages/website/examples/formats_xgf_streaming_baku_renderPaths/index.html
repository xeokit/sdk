<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XGF Baku Stadium Render Paths</title>
  <link rel="icon" href="data:,">
  <link href="../../css/example-page.css" rel="stylesheet"/>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #dfe8ed;
      color: #1f2933;
    }

    #demoCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: linear-gradient(#d4e3ed 0%, #f3f6f8 100%);
    }

    .xkt-toolbar,
    .xkt-info-panel,
    .xkt-info-pill,
    .xkt-issues-panel,
    .xkt-issues-pill,
    .xkt-pill-rail,
    .xkt-vp-header {
      display: none !important;
    }

    #panel {
      position: fixed;
      top: 16px;
      right: 16px;
      width: min(430px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      border: 1px solid rgba(31, 41, 51, 0.16);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 16px 36px rgba(31, 41, 51, 0.18);
      z-index: 3000000;
    }

    .header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(31, 41, 51, 0.12);
    }

    .header h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.25;
    }

    .header p,
    #status {
      margin: 7px 0 0;
      font-size: 12px;
      line-height: 1.45;
      color: #52606d;
    }

    .mode-control {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(31, 41, 51, 0.12);
    }

    .mode-control button {
      min-width: 0;
      height: 34px;
      border: 1px solid rgba(31, 41, 51, 0.16);
      border-radius: 7px;
      background: #f7fafb;
      color: #2f3b45;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .mode-control button.active {
      border-color: #356a83;
      background: #dcecf2;
      color: #24485a;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(31, 41, 51, 0.12);
    }

    .metric {
      min-height: 52px;
      padding: 8px;
      border: 1px solid rgba(31, 41, 51, 0.12);
      border-radius: 7px;
      background: #f7fafb;
    }

    .metric strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 17px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .metric span {
      display: block;
      margin-top: 5px;
      font-size: 11px;
      color: #65717d;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(31, 41, 51, 0.12);
      font-size: 12px;
    }

    .details div {
      min-width: 0;
      padding: 8px;
      border: 1px solid rgba(31, 41, 51, 0.12);
      border-radius: 7px;
      background: #fbfcfd;
    }

    .details span {
      display: block;
      margin-bottom: 4px;
      color: #65717d;
      font-size: 11px;
    }

    #status {
      padding: 0 16px 14px;
      margin-top: 0;
      border-bottom: 1px solid rgba(31, 41, 51, 0.12);
    }

    .chunk-list {
      display: grid;
      gap: 6px;
      padding: 12px;
    }

    .chunk {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(31, 41, 51, 0.12);
      border-radius: 7px;
      background: #fff;
      font-size: 12px;
    }

    .chunk strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chunk small {
      display: block;
      margin-top: 3px;
      color: #65717d;
      font-size: 11px;
    }

    .state {
      min-width: 58px;
      padding: 3px 7px;
      border-radius: 999px;
      background: #edf1f5;
      color: #43505c;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
    }

    .state.loaded {
      background: #d8f3e5;
      color: #0f5132;
    }

    .state.loading {
      background: #fff1c7;
      color: #6d4b00;
    }
  </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<section id="panel">
  <div class="header">
    <h1>Baku Stadium XGF Render Paths</h1>
    <p>Baku Stadium XGF stream with manual WebGL opaque-triangle path selection.</p>
  </div>
  <div class="mode-control" role="group" aria-label="Render path">
    <button type="button" data-mode="dtx">DTX</button>
    <button type="button" data-mode="vbo">VBO</button>
  </div>
  <div class="metrics">
    <div class="metric"><strong id="loadedChunks">0/0</strong><span>chunks</span></div>
    <div class="metric"><strong id="objectCount">0</strong><span>objects</span></div>
    <div class="metric"><strong id="meshCount">0</strong><span>meshes</span></div>
  </div>
  <div class="metrics">
    <div class="metric"><strong id="handledPrims">0</strong><span>VBO primitives</span></div>
    <div class="metric"><strong id="fallbackPrims">0</strong><span>fallback primitives</span></div>
    <div class="metric"><strong id="rebuilds">0</strong><span>blocked VBO batches</span></div>
  </div>
  <div class="details">
    <div><span>active storage</span><strong id="activePath">DTX</strong></div>
    <div><span>handled VBO batches</span><strong id="warmPrims">0</strong></div>
    <div><span>load elapsed</span><strong id="elapsed">0.0s</strong></div>
    <div><span>queue</span><strong id="queue">0/0</strong></div>
    <div><span>assets</span><strong id="assetChunks">0</strong></div>
  </div>
  <p id="status">Initializing...</p>
  <div id="chunkList" class="chunk-list"></div>
</section>
</body>
<script type="module" src="./index.js"></script>
</html>
