<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XGF Streaming OTC Conference Center</title>
  <link rel="icon" href="data:,">
  <link href="../../css/example-page.css" rel="stylesheet"/>
  <style>
    body {
      background: #eef2f3;
      overflow: hidden;
      margin: 0;
      user-select: none;
      font-family: Arial, sans-serif;
    }

    #demoCanvas {
      width: 100%;
      height: 100%;
      position: absolute;
      background: linear-gradient(#dfe8ee 0%, #eef2f3 58%, #f7f8f8 100%);
      border: 0;
    }

    .xeokit-loading-overlay {
      display: none !important;
    }

    .xkt-info-panel,
    .xkt-info-pill {
      display: none !important;
    }

    #streamPanel {
      position: fixed !important;
      top: 44px !important;
      right: 16px !important;
      width: min(430px, calc(100vw - 32px));
      max-height: calc(100vh - 68px);
      overflow: auto;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(35, 43, 52, 0.18);
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(30, 38, 48, 0.18);
      color: #1f2933;
      z-index: 2147483647;
    }

    .panel-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(35, 43, 52, 0.12);
    }

    .panel-header h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 700;
    }

    .panel-header p {
      margin: 6px 0 0;
      font-size: 12px;
      line-height: 1.4;
      color: #52606d;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px 16px;
    }

    .metric {
      min-height: 50px;
      border: 1px solid rgba(35, 43, 52, 0.12);
      border-radius: 7px;
      background: #f8fafb;
      padding: 8px;
    }

    .metric strong {
      display: block;
      font-size: 17px;
      line-height: 1.1;
    }

    .metric span {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      color: #65717d;
    }

    .queue-progress {
      margin: 0 16px 16px;
      padding: 12px;
      border: 1px solid rgba(35, 43, 52, 0.12);
      border-radius: 7px;
      background: #f8fafb;
    }

    .queue-progress label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
      color: #65717d;
    }

    .queue-progress strong {
      font-size: 12px;
      color: #26313b;
      font-weight: 650;
      white-space: nowrap;
    }

    .queue-progress input {
      display: block;
      width: 100%;
      height: 8px;
      margin: 12px 0 0;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #6f8798 var(--progress, 0%), #dce3e8 var(--progress, 0%));
      appearance: none;
      -webkit-appearance: none;
      pointer-events: none;
    }

    .queue-progress input::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 0;
      height: 0;
      border: 0;
    }

    .queue-progress input::-moz-range-thumb {
      width: 0;
      height: 0;
      border: 0;
    }

    .queue-progress input::-moz-range-track {
      height: 8px;
      border: 0;
      border-radius: 999px;
      background: transparent;
    }

    .issue-list {
      padding: 0 16px 16px;
    }

    .issue-list h2 {
      margin: 4px 0 8px;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 700;
      color: #26313b;
    }

    .issue-card {
      display: block;
      width: 100%;
      min-height: 56px;
      margin: 0 0 8px;
      padding: 9px 10px;
      text-align: left;
      background: #f8fafb;
      border: 1px solid rgba(35, 43, 52, 0.14);
      border-radius: 7px;
      color: #1f2933;
      cursor: pointer;
    }

    .issue-card:hover,
    .issue-card:focus-visible {
      border-color: rgba(70, 94, 112, 0.44);
      background: #eef4f7;
      outline: none;
    }

    .issue-card[aria-pressed="true"] {
      border-color: #6f8798;
      box-shadow: inset 3px 0 0 #6f8798;
      background: #eef4f7;
    }

    .issue-card strong {
      display: block;
      font-size: 12px;
      line-height: 1.25;
      font-weight: 700;
    }

    .issue-card span {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      line-height: 1.3;
      color: #5f6f7c;
    }

    .issue-card em {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 6px;
      border-radius: 999px;
      background: #dbeaf6;
      color: #36566f;
      font-style: normal;
      font-size: 10px;
      line-height: 1.2;
      font-weight: 700;
    }
  </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="streamPanel">
  <div class="panel-header">
    <h1>XGF Streaming OTC Conference Center</h1>
    <p>Streams the OTC Conference Center BIM model from a shared XGF asset library and 77 spatial references-only chunks.</p>
  </div>
  <div class="metrics">
    <div class="metric"><strong id="loadedChunks">0</strong><span>loaded chunks</span></div>
    <div class="metric"><strong id="objectCount">0</strong><span>objects</span></div>
    <div class="metric"><strong id="meshCount">0</strong><span>meshes</span></div>
  </div>
  <div class="queue-progress">
    <label for="frustumQueueProgress">
      <span>Frustum chunks loaded</span>
      <strong id="frustumQueueLabel"><span id="frustumLoadedCount">0</span>/<span id="frustumQueuedCount">0</span> loaded</strong>
    </label>
    <input id="frustumQueueProgress" type="range" min="0" max="0" value="0" disabled>
  </div>
  <div class="issue-list">
    <h2>Simulated BCF Issues</h2>
    <button class="issue-card" type="button" data-issue-id="BCF-OTC-021" aria-pressed="false">
      <strong>BCF-OTC-021 Front HVAC detail</strong>
      <span>Small exterior fan and duct run</span>
    </button>
    <button class="issue-card" type="button" data-issue-id="BCF-OTC-034" aria-pressed="false">
      <strong>BCF-OTC-034 Main hall coordination</strong>
      <span>Central structure and adjacent bays</span>
    </button>
    <button class="issue-card" type="button" data-issue-id="BCF-OTC-047" aria-pressed="false">
      <strong>BCF-OTC-047 Concourse span check</strong>
      <span>Mid-building circulation zone</span>
    </button>
    <button class="issue-card" type="button" data-issue-id="BCF-OTC-058" aria-pressed="false">
      <strong>BCF-OTC-058 East wing envelope</strong>
      <span>Outer bay and service-side structure</span>
    </button>
    <button class="issue-card" type="button" data-issue-id="BCF-OTC-063" aria-pressed="false">
      <strong>BCF-OTC-063 South elevation context</strong>
      <span>Long facade and roof-line relationship</span>
    </button>
    <button class="issue-card" type="button" data-issue-id="BCF-OTC-079" aria-pressed="false">
      <strong>BCF-OTC-079 Overall model context</strong>
      <span>Whole conference center overview</span>
      <em>loads broad context</em>
    </button>
  </div>
</div>
</body>
<script type="module" src="./index.js"></script>
</html>
