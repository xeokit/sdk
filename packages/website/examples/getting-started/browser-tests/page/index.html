<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SDK Browser Tests</title>
    <link href="../../../../css/example-page.css" rel="stylesheet"/>
    <style>
        :root {
            color-scheme: light;
            --bg: #f8fafc;
            --panel: #ffffff;
            --ink: #111827;
            --muted: #64748b;
            --line: #d7dde8;
            --ok: #047857;
            --warn: #b45309;
            --fail: #b91c1c;
            --accent: #155e75;
            --accent-soft: #e0f2fe;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--ink);
            font: 13px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #runner {
            position: absolute;
            inset: 84px 16px 16px;
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr);
            gap: 12px;
            min-width: 0;
        }

        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-width: 0;
        }

        h1 {
            margin: 0;
            color: #0f172a;
            font-size: 18px;
            line-height: 1.25;
            letter-spacing: 0;
        }

        #state {
            flex: 0 0 auto;
            min-width: 76px;
            padding: 5px 9px;
            border-radius: 999px;
            background: #e2e8f0;
            color: #334155;
            font-weight: 650;
            text-align: center;
        }

        #state.running {
            background: #fef3c7;
            color: var(--warn);
        }

        #state.pass {
            background: #d1fae5;
            color: var(--ok);
        }

        #state.fail {
            background: #fee2e2;
            color: var(--fail);
        }

        #controls {
            display: grid;
            grid-template-columns: minmax(180px, 1fr) auto auto auto;
            gap: 8px;
            align-items: center;
        }

        input {
            min-width: 0;
            height: 34px;
            box-sizing: border-box;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--panel);
            color: var(--ink);
            padding: 6px 9px;
            font: inherit;
        }

        button {
            appearance: none;
            height: 34px;
            border: 1px solid #94a3b8;
            border-radius: 6px;
            background: var(--panel);
            color: #0f172a;
            padding: 0 12px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button.primary {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }

        button:disabled {
            cursor: progress;
            opacity: 0.6;
        }

        #summary {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 8px;
        }

        .metric {
            min-width: 0;
            padding: 9px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
        }

        .metric .label {
            display: block;
            color: var(--muted);
            font-size: 11px;
        }

        .metric .value {
            display: block;
            margin-top: 3px;
            color: var(--ink);
            font: 13px/1.35 ui-monospace, Menlo, Consolas, monospace;
            overflow-wrap: anywhere;
        }

        #output {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(280px, 35%);
            gap: 12px;
            min-height: 0;
        }

        #log,
        #failures {
            min-height: 0;
            margin: 0;
            overflow: auto;
            border: 1px solid #0f172a;
            border-radius: 8px;
            background: #111827;
            color: #dbeafe;
            padding: 11px;
            box-sizing: border-box;
            white-space: pre-wrap;
            font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
        }

        #failures {
            border-color: var(--line);
            background: var(--panel);
            color: var(--ink);
        }

        .muted {
            color: var(--muted);
        }

        .ok {
            color: var(--ok);
        }

        .fail {
            color: var(--fail);
        }

        @media (max-width: 900px) {
            #runner {
                inset: 72px 10px 10px;
            }

            #controls,
            #summary,
            #output {
                grid-template-columns: 1fr;
            }

            #output {
                grid-template-rows: minmax(260px, 1fr) minmax(180px, 0.55fr);
            }
        }
    </style>
</head>
<body class="xeokit-loading-spinner-ready">
<main id="runner" aria-label="SDK browser test runner">
    <section id="header">
        <h1>SDK Browser Tests</h1>
        <div id="state">Idle</div>
    </section>
    <section id="controls" aria-label="Controls">
        <input id="testPath" type="text" autocomplete="off" spellcheck="false"
               placeholder="All tests, or src/formats/svg/tests/svg.test.ts">
        <button id="run" class="primary" type="button">Run</button>
        <button id="stop" type="button" disabled>Stop</button>
        <button id="clear" type="button">Clear</button>
    </section>
    <section id="summary" aria-label="Summary">
        <div class="metric"><span class="label">Suites</span><span id="suites" class="value">-</span></div>
        <div class="metric"><span class="label">Tests</span><span id="tests" class="value">-</span></div>
        <div class="metric"><span class="label">Passed</span><span id="passed" class="value">-</span></div>
        <div class="metric"><span class="label">Failed</span><span id="failed" class="value">-</span></div>
        <div class="metric"><span class="label">Time</span><span id="time" class="value">-</span></div>
        <div class="metric"><span class="label">Output</span><span id="json" class="value">-</span></div>
    </section>
    <section id="output" aria-label="Output">
        <pre id="log"></pre>
        <pre id="failures" class="muted">No failures.</pre>
    </section>
</main>
<script type="module" src="./index.js"></script>
</body>
</html>
