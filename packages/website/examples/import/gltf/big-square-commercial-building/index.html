<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Viewing a glTF Big Square Commercial Building Model</title>
    <link href="../../../../css/example-loading.css" rel="stylesheet"/>
    <style>
        body {
            background-color: #d9e2ec;
            overflow: hidden;
            margin: 0;
            user-select: none;
        }

        #demoCanvas {
            width: 100%;
            height: 100%;
            position: absolute;
            background: #d9e2ec;
            border: 0;
        }

        #status {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.62);
            color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            border-radius: 4px;
            z-index: 10;
        }
    </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="status">Loading Big Square Commercial Building...</div>
</body>
<script type="module" src="./index.js"></script>
</html>
