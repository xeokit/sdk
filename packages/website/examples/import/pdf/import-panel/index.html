<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDF import panel — drag & drop</title>
    <link href="../../../../css/example-page.css" rel="stylesheet"/>
    <style>
        body {
            background-color: white;
            overflow: hidden;
            margin: 0;
            user-select: none;
        }
        #demoCanvas {
            width: 100%;
            height: 100%;
            position: absolute;
            background: white;
            border: 0;
        }
        #status {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(360px, calc(100vw - 48px));
            padding: 24px;
            box-sizing: border-box;
            border: 1px solid #d6dee8;
            border-radius: 8px;
            background: white;
            color: #1e3f66;
            box-shadow: 0 12px 30px rgba(15, 31, 48, 0.18);
            font: 600 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-align: center;
        }
        #status::before {
            content: "Import PDF Drawing";
            display: block;
            margin-bottom: 12px;
            color: #20242a;
            font-size: 18px;
        }
        #status::after {
            content: "Drop a PDF file onto the canvas";
            display: block;
            margin-top: 14px;
            padding: 28px 16px;
            border: 2px dashed #bed0e3;
            border-radius: 8px;
            color: #2c638f;
        }
    </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="status">Ready</div>
</body>
<script type="module" src="./index.js"></script>
</html>
