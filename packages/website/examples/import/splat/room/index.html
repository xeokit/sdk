<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Viewing a 3D Gaussian Splatting Scene</title>
    <link href="../../../../css/example-loading.css" rel="stylesheet"/>
    <style>
        body { background-color: black; overflow: hidden; margin: 0; user-select: none; }
        #demoCanvas { width: 100%; height: 100%; position: absolute; background: black; border: 0; }
        #status {
            position: absolute; top: 12px; left: 12px; padding: 6px 12px;
            background: rgba(0, 0, 0, 0.6); color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 13px; border-radius: 6px;
        }
        #caption {
            display: none; position: absolute; bottom: 12px; left: 12px; max-width: 520px;
            padding: 8px 12px; background: rgba(0, 0, 0, 0.6); color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 12px; line-height: 1.5; border-radius: 6px;
        }
        #pickinfo {
            display: none; position: absolute; top: 12px; left: 12px;
            padding: 6px 12px; background: rgba(0, 0, 0, 0.6); color: #7CFC9A;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px; border-radius: 6px;
        }
    </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="status">Loading…</div>
<div id="caption">
    Captured interior as a 3D Gaussian Splatting scene (.splat) — the kind of
    as-built reality capture used for BIM / archviz context. Drag to orbit,
    scroll to zoom, right-drag to pan. <b>Click a surface to pick its world position.</b>
</div>
<div id="pickinfo"></div>
</body>
<script type="module" src="./index.js"></script>
</html>
