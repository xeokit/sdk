<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Streaming a Procedural City as 3D Tiles</title>
    <link href="../../../../css/example-loading.css" rel="stylesheet"/>
    <style>
        body { background-color: #192126; overflow: hidden; margin: 0; user-select: none; }
        #demoCanvas { width: 100%; height: 100%; position: absolute; inset: 0; z-index: 0; background: #192126; border: 0; }
        #status {
            position: absolute; top: 12px; left: 12px; z-index: 200000001;
            padding: 8px 12px; max-width: min(620px, calc(100vw - 24px));
            background: rgba(12, 17, 20, 0.76); color: #f4f7f8;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 13px; line-height: 1.35; border-radius: 6px;
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.32);
            backdrop-filter: blur(8px);
        }
        #status strong { font-weight: 700; }
        .streamInfo { display: block; margin-top: 4px; color: #c7d2d6; }
    </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="status">Loading...</div>
</body>
<script type="module" src="./index.js"></script>
</html>
