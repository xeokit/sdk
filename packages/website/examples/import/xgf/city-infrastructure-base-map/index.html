<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>XGF City Infrastructure Base Map</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #f5f7fa;
            color: #111827;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #demoCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #f5f7fa;
        }

        #status {
            position: fixed;
            left: 14px;
            top: 14px;
            z-index: 2147483647;
            max-width: min(560px, calc(100vw - 28px));
            padding: 10px 12px;
            border: 1px solid rgba(15, 23, 42, 0.18);
            background: rgba(255, 255, 255, 0.94);
            color: #1f2937;
            font-size: 13px;
            line-height: 1.45;
        }

        #status[data-state="ok"] {
            border-color: rgba(22, 163, 74, 0.45);
        }

        #status[data-state="error"] {
            border-color: rgba(220, 38, 38, 0.55);
            color: #991b1b;
        }

        #progressPanel {
            position: fixed;
            left: 14px;
            top: 72px;
            z-index: 2147483647;
            display: none;
            width: min(420px, calc(100vw - 28px));
            padding: 10px 12px;
            border: 1px solid rgba(15, 23, 42, 0.14);
            background: rgba(255, 255, 255, 0.94);
            color: #334155;
            font-size: 12px;
            line-height: 1.35;
        }

        #progressPanel[data-visible="true"] {
            display: block;
        }

        #progressTrack {
            position: relative;
            height: 6px;
            margin-top: 8px;
            overflow: hidden;
            background: #dbe3ed;
        }

        #progressBar {
            width: 0;
            height: 100%;
            background: #2563eb;
            transition: width 120ms ease;
        }

        #progressPanel[data-indeterminate="true"] #progressBar {
            position: absolute;
            width: 34%;
            animation: progress-slide 1.1s ease-in-out infinite;
        }

        #toolbar {
            position: fixed;
            left: 14px;
            bottom: 14px;
            z-index: 2147483647;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px;
            border: 1px solid rgba(15, 23, 42, 0.18);
            background: rgba(255, 255, 255, 0.94);
            font-size: 12px;
        }

        #toolbar a {
            color: #1d4ed8;
            text-decoration: none;
            border-bottom: 1px solid rgba(29, 78, 216, 0.45);
        }

        #toolbar label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #334155;
            white-space: nowrap;
        }

        #toolbar input {
            margin: 0;
        }

        #fpsMeter {
            position: fixed;
            right: 14px;
            top: 14px;
            z-index: 2147483647;
            min-width: 122px;
            padding: 8px 10px;
            border: 1px solid rgba(15, 23, 42, 0.18);
            background: rgba(17, 24, 39, 0.88);
            color: #f8fafc;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            line-height: 1.35;
            pointer-events: none;
        }

        #fpsMeter strong {
            display: block;
            font-size: 17px;
            line-height: 1.1;
            font-weight: 650;
        }

        #fpsMeter span {
            display: block;
            color: #cbd5e1;
            white-space: nowrap;
        }

        #rendererBadge {
            position: fixed;
            right: 14px;
            bottom: 14px;
            z-index: 2147483647;
            min-width: 72px;
            padding: 7px 10px;
            border: 1px solid rgba(15, 23, 42, 0.18);
            background: rgba(15, 23, 42, 0.88);
            color: #f8fafc;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
            text-align: center;
            pointer-events: none;
        }

        #rendererBadge[data-renderer="webgpu"] {
            background: rgba(30, 64, 175, 0.9);
        }

        #minimap {
            position: fixed;
            right: 14px;
            bottom: 52px;
            z-index: 2147483647;
            width: 320px;
            height: 200px;
            border: 1px solid rgba(15, 23, 42, 0.24);
            background: rgba(248, 250, 252, 0.9);
            box-shadow: 0 4px 18px rgba(15, 23, 42, 0.14);
            pointer-events: none;
        }

        @media (max-width: 680px) {
            #minimap {
                width: 220px;
                height: 138px;
                right: 10px;
                bottom: 48px;
            }
        }

        @keyframes progress-slide {
            0% {
                left: -36%;
            }
            100% {
                left: 102%;
            }
        }
    </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="status">Initializing viewer...</div>
<div id="progressPanel">
    <div id="progressLabel">Loading...</div>
    <div id="progressTrack">
        <div id="progressBar"></div>
    </div>
</div>
<div id="toolbar">
    <a href="?renderer=webgl&nav=vehicle">WebGL vehicle</a>
    <a href="?renderer=webgpu&nav=vehicle">WebGPU vehicle</a>
    <a href="?renderer=webgl&nav=model">Model nav</a>
    <label><input id="buildingsToggle" type="checkbox" checked> Buildings</label>
    <label><input id="shadowsToggle" type="checkbox"> Shadows</label>
    <label><input id="saoToggle" type="checkbox" checked> SAO</label>
    <label><input id="streetLamps" type="checkbox" checked> Street lamps</label>
    <label><input id="skateboardSound" type="checkbox" checked> Skate audio</label>
</div>
<div id="fpsMeter">
    <strong id="fpsValue">-- FPS</strong>
    <span id="frameMsValue">-- ms/frame</span>
    <span id="rafValue">-- RAF</span>
</div>
<canvas id="minimap" width="320" height="200" aria-label="Skater minimap"></canvas>
<div id="rendererBadge">WEBGL</div>
<script type="module" src="index.js"></script>
</body>
</html>
