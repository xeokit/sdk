<!doctype html>
<html>
<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loading Performance — IFC vs glTF vs XGF vs .splat</title>
    <style>
        body {
            margin: 0; padding: 24px;
            background: #0f1115; color: #e6e6e6;

            font-size: 14px; line-height: 1.5;
        }
        h1 { font-size: 18px; margin: 0 0 4px; }
        #status { color: #f0c674; min-height: 20px; margin: 10px 0; font-variant-numeric: tabular-nums; }

        th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid #2a2e37; }

        td.err { color: #ff7c7c; }

        /* Small live canvas the GPU-timing pass renders into (real GPU only). */
        #demoCanvas {

        }
