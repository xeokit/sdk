<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Triangle-Precise Picking Stress Test (Cityscape)</title>
    <style>
        html, body {
            background-color: white;
            overflow: hidden;
            margin: 0;
            height: 100%;
            user-select: none;
            cursor: none; /* hide the system cursor — our HTML cursor takes over */
        }

        #demoCanvas {
            width: 100%;
            height: 100%;
            position: absolute;
            background: white;
            border: 0;
        }

        /* HTML cursor — a small ring + dot positioned via CSS transform.
           Crucially, moving it costs nothing on the 3D side: no scene
           mutation, no needsRender(), no GL state change. The browser
           composites this layer separately from the canvas. */
        #pickCursor {
          z-index: 200000;
            position: absolute;
            top: 0; left: 0;
            width: 22px;
            height: 22px;
            margin-left: -11px;
            margin-top:  -11px;
            border-radius: 50%;
            border: 2px solid rgba(140, 140, 140, 0.85);
            background: rgba(140, 140, 140, 0.18);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.4);
            pointer-events: none;
            transition: background 80ms ease-out, border-color 80ms ease-out, transform 0s;
            will-change: transform;
        }
        #pickCursor::after {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            width: 4px;
            height: 4px;
            margin-left: -2px;
            margin-top:  -2px;
            border-radius: 50%;
            background: rgba(140, 140, 140, 0.85);
            transition: background 80ms ease-out;
        }
        /* Hit state — green */
        #pickCursor.hit {
            border-color: rgba(60, 200, 90, 0.95);
            background: rgba(60, 200, 90, 0.28);
        }
        #pickCursor.hit::after {
            background: rgba(40, 220, 80, 1);
        }
        /* Cursor parked off-screen until the first mousemove */
        #pickCursor.parked {
            opacity: 0;
        }

        #hitStatus {

          z-index: 200000;
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 10px 14px;
            background: rgba(15, 17, 22, 0.85);
            color: #e7e7e7;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            line-height: 1.45;
            border-radius: 8px;
            pointer-events: none;
            min-width: 320px;
        }

        #hitStatus .label  { color: #aaa; }
        #hitStatus .value  { color: #ffe7b3; }
        #hitStatus .number { color: #b3e6c7; }
        #hitStatus .nohit  { color: #888; font-style: italic; }

        /* GPU-pick counter — green so long as it stays at zero, red the
           moment any code path falls back to renderer.pick. */
        #hitGpuPicks.zero { color: #6fdc8c; font-weight: 600; }
        #hitGpuPicks.nonzero { color: #ff6b6b; font-weight: 700; }
    </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="pickCursor" class="parked"></div>
<div id="hitStatus">
    <div><span class="label">Object:&nbsp;</span><span id="hitObjectId" class="nohit">— move mouse over city —</span></div>
    <div><span class="label">Hit point:&nbsp;</span><span id="hitPos" class="nohit">—</span></div>
    <div><span class="label">tHit:&nbsp;</span><span id="hitT" class="number">—</span></div>
    <div><span class="label">BVH size:&nbsp;</span><span id="hitBvhSize" class="number">0</span></div>
    <div><span class="label">BVH build:&nbsp;</span><span id="hitBuildMs" class="number">—</span> ms</div>
    <div><span class="label">Last query:&nbsp;</span><span id="hitQueryUs" class="number">0</span> µs</div>
    <div><span class="label">GPU picks:&nbsp;</span><span id="hitGpuPicks" class="zero">0</span></div>
</div>
</body>
<script type="module" src="./index.js"></script>
</html>
