<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebGLRenderer — snap-to-vertex / snap-to-edge on thick lines</title>
  <link href="../../css/example-page.css" rel="stylesheet"/>
  <style>
    body {
      background-color: #f6f7f9;
      overflow: hidden;
      margin: 0;
      user-select: none;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #111;
    }

    #demoCanvas {
      position: absolute;
      inset: 0;
      background: white;
      border: 0;
    }

    /* Snap status indicator — pill at top-right showing whether
       the cursor is currently snapped to a vertex (red), edge
       (amber), or nothing (grey). Driven inline from the snap
       loop in index.js via data-mode. */
    #status {
      position: absolute;
      top: 142px;
      right: 12px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      color: #555;
      z-index: 300000;
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    }
    #status[data-mode="vertex"] { color: #fff; background: #d04040; border-color: #a02020; }
    #status[data-mode="edge"]   { color: #fff; background: #d6a020; border-color: #976d0a; }

    /* Snap-target dot — follows the snapped vertex / edge point. */
    #marker {
      position: absolute;
      top: 0;
      left: 0;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9), 0 1px 3px rgba(0, 0, 0, 0.35);
      transition: background 80ms ease, border-color 80ms ease;
      z-index: 200000;
      display: none;
    }
    #marker[data-mode="vertex"] { background: #d04040; }
    #marker[data-mode="edge"]   { background: #d6a020; }
  </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="marker"></div>
<div id="status" data-mode="none">No snap</div>
<script type="module" src="./index.js"></script>
</body>
</html>
