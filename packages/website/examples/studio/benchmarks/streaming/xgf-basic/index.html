<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XGF Streaming Benchmark</title>
  <link href="../../../../../css/example-page.css" rel="stylesheet"/>
  <style>
    body {
      background: #eef2f3;
      overflow: hidden;
      margin: 0;
      user-select: none;
      font-family: Arial, sans-serif;
    }

    #demoCanvas {
      width: 100%;
      height: 100%;
      position: absolute;
      background: #eef2f3;
      border: 0;
    }

    #benchmarkPanel {
      position: fixed !important;
      top: 44px !important;
      right: 16px !important;
      width: min(430px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(35, 43, 52, 0.18);
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(30, 38, 48, 0.18);
      color: #1f2933;
      z-index: 3000000;
    }

    .panel-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(35, 43, 52, 0.12);
    }

    .panel-header h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 700;
    }

    .panel-header p {
      margin: 6px 0 0;
      font-size: 12px;
      line-height: 1.4;
      color: #52606d;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(35, 43, 52, 0.12);
    }

    .policy {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 0 16px 12px;
      border-bottom: 1px solid rgba(35, 43, 52, 0.12);
      font-size: 12px;
      color: #52606d;
    }

    .policy span {
      min-height: 28px;
      border: 1px solid rgba(35, 43, 52, 0.12);
      border-radius: 7px;
      background: #f8fafb;
      padding: 7px 8px;
    }

    .metric {
      min-height: 50px;
      border: 1px solid rgba(35, 43, 52, 0.12);
      border-radius: 7px;
      background: #f8fafb;
      padding: 8px;
    }

    .metric strong {
      display: block;
      font-size: 17px;
      line-height: 1.1;
    }

    .metric span {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      color: #65717d;
    }

    #benchmarkStatus {
      padding: 12px 16px;
      font-size: 12px;
      line-height: 1.45;
      color: #52606d;
      border-bottom: 1px solid rgba(35, 43, 52, 0.12);
    }

    #chunkList {
      display: grid;
      gap: 6px;
      padding: 12px;
    }

    .chunk {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(35, 43, 52, 0.12);
      border-radius: 7px;
      background: #ffffff;
      font-size: 12px;
    }

    .chunk small {
      display: block;
      margin-top: 3px;
      color: #65717d;
      font-size: 11px;
    }

    .state {
      display: inline-flex;
      align-items: center;
      min-width: 58px;
      justify-content: center;
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      color: #43505c;
      background: #edf1f5;
    }

    .state.loaded {
      color: #0f5132;
      background: #d8f3e5;
    }
  </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="benchmarkPanel">
  <div class="panel-header">
    <h1>XGF Streaming Benchmark</h1>
    <p>Generated hilly inner-city district with 961 block chunks, loading the full chunk set while prioritizing chunks near the current view first.</p>
  </div>
  <div class="metrics">
    <div class="metric"><strong id="loadedChunks">0</strong><span>loaded chunks</span></div>
    <div class="metric"><strong id="objectCount">0</strong><span>objects</span></div>
    <div class="metric"><strong id="meshCount">0</strong><span>meshes</span></div>
  </div>
  <div class="policy">
    <span id="queueStatus">0/0 queued chunk(s) loaded</span>
    <span id="budget">0 total chunks</span>
  </div>
  <div id="benchmarkStatus">Initializing...</div>
  <div id="chunkList"></div>
</div>
</body>
<script type="module" src="./index.js"></script>
</html>
