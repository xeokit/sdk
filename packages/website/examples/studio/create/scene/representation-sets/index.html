<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SceneModel JSON Representation Sets</title>
    <link href="../../../../../css/example-page.css" rel="stylesheet"/>
    <style>
        body {
            background-color: #eef3f5;
            overflow: hidden;
            margin: 0;
            user-select: none;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #demoCanvas {
            width: 100%;
            height: 100%;
            position: absolute;
            background: #eef3f5;
            border: 0;
        }

        #panel {
            position: absolute;
            top: 16px;
            left: 16px;
            width: min(340px, calc(100vw - 32px));
            background: rgba(248, 250, 252, 0.94);
            border: 1px solid rgba(15, 23, 42, 0.14);
            border-radius: 8px;
            box-shadow: 0 16px 44px rgba(15, 23, 42, 0.18);
            color: #172033;
            padding: 14px;
        }

        #panel h1 {
            font-size: 15px;
            line-height: 20px;
            margin: 0 0 10px 0;
            font-weight: 650;
        }

        .repSet {
            padding-top: 10px;
            border-top: 1px solid rgba(15, 23, 42, 0.12);
        }

        .repSet + .repSet {
            margin-top: 10px;
        }

        .repSetTitle {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 12px;
            color: #4b5563;
            margin-bottom: 8px;
        }

        .repButtons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .repButtons button {
            appearance: none;
            border: 1px solid rgba(15, 23, 42, 0.18);
            background: #ffffff;
            color: #172033;
            border-radius: 6px;
            padding: 6px 9px;
            font: inherit;
            font-size: 12px;
            line-height: 16px;
            cursor: pointer;
        }

        .repButtons button[aria-pressed="true"] {
            background: #123a5d;
            border-color: #123a5d;
            color: white;
        }

        #status {
            margin-top: 12px;
            font-size: 12px;
            line-height: 17px;
            color: #475569;
        }

        #error {
            display: none;
            margin-top: 10px;
            color: #9f1239;
            font-size: 12px;
            line-height: 17px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<section id="panel">
    <h1>SceneModel JSON Representation Sets</h1>
    <div id="repSets"></div>
    <div id="status">Loading sceneModel.json...</div>
    <div id="error"></div>
</section>
</body>
<script type="module" src="./index.js"></script>
</html>
