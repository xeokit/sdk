<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procedural Tree Generator</title>
  <link href="../../../../../css/example-page.css" rel="stylesheet"/>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      user-select: none;
      background: #e8ece5;
      color: #20231f;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    #demoCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #e8ece5;
      z-index: 100001;
    }

    #panel {
      position: absolute;
      top: 16px;
      right: 16px;
      width: min(336px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      box-sizing: border-box;
      padding: 16px;
      border: 1px solid rgba(24, 28, 24, 0.12);
      border-radius: 8px;
      background: rgba(250, 251, 248, 0.94);
      box-shadow: 0 18px 42px rgba(24, 28, 24, 0.20);
      backdrop-filter: blur(8px);
      z-index: 200000050;
    }

    #panel h1 {
      margin: 0 0 12px;
      font-size: 17px;
      line-height: 1.2;
      font-weight: 700;
      color: #1f261d;
    }

    .control {
      display: grid;
      grid-template-columns: 94px minmax(0, 1fr) 42px;
      gap: 10px;
      align-items: center;
      margin: 9px 0;
      font-size: 12px;
    }

    .control label {
      color: #394236;
    }

    .control input[type="range"] {
      width: 100%;
      min-width: 0;
      accent-color: #315f3b;
    }

    .control input[type="number"],
    .control select {
      min-width: 0;
      height: 28px;
      border: 1px solid #d8ded2;
      border-radius: 4px;
      background: #fff;
      color: #20231f;
      font-size: 12px;
    }

    .control .value {
      text-align: right;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #315f3b;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 13px;
    }

    button {
      height: 31px;
      border: 1px solid #cdd6c7;
      border-radius: 5px;
      background: #f6f8f4;
      color: #1f261d;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover {
      background: #eef3ea;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 14px;
    }

    .stat {
      min-width: 0;
      padding: 8px;
      border: 1px solid #dbe2d6;
      border-radius: 6px;
      background: #fff;
    }

    .stat strong {
      display: block;
      font-size: 16px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: #244f31;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      color: #5b6757;
      font-size: 10px;
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      #panel {
        top: auto;
        right: 10px;
        bottom: 10px;
        left: 10px;
        width: auto;
        max-height: 48vh;
      }
    }
  </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<section id="panel">
  <h1>Procedural Tree Generator</h1>
  <div class="control">
    <label for="species">Species</label>
    <select id="species">
      <option value="oak">Broadleaf</option>
      <option value="pine">Conifer</option>
      <option value="columnar">Columnar</option>
      <option value="windswept">Windswept</option>
    </select>
    <span></span>
  </div>
  <div class="control">
    <label for="height">Height</label>
    <input id="height" type="range" min="7" max="22" step="0.5" value="13">
    <span id="heightValue" class="value"></span>
  </div>
  <div class="control">
    <label for="levels">Levels</label>
    <input id="levels" type="range" min="2" max="5" step="1" value="4">
    <span id="levelsValue" class="value"></span>
  </div>
  <div class="control">
    <label for="spread">Spread</label>
    <input id="spread" type="range" min="0.2" max="1.2" step="0.02" value="0.78">
    <span id="spreadValue" class="value"></span>
  </div>
  <div class="control">
    <label for="density">Leaves</label>
    <input id="density" type="range" min="0.1" max="1" step="0.02" value="0.72">
    <span id="densityValue" class="value"></span>
  </div>
  <div class="control">
    <label for="leafSize">Leaf size</label>
    <input id="leafSize" type="range" min="0.45" max="1.8" step="0.05" value="1.15">
    <span id="leafSizeValue" class="value"></span>
  </div>
  <div class="control">
    <label for="trunkRadius">Trunk</label>
    <input id="trunkRadius" type="range" min="0.2" max="0.85" step="0.02" value="0.42">
    <span id="trunkRadiusValue" class="value"></span>
  </div>
  <div class="control">
    <label for="seed">Seed</label>
    <input id="seed" type="number" min="1" max="999999" step="1" value="23117">
    <span></span>
  </div>
  <div class="buttons">
    <button id="randomize" type="button">Randomize</button>
    <button id="reset" type="button">Reset</button>
  </div>
  <div class="stats">
    <div class="stat"><strong id="branchCount">0</strong><span>branches</span></div>
    <div class="stat"><strong id="leafCount">0</strong><span>leaf clusters</span></div>
    <div class="stat"><strong id="meshCount">0</strong><span>meshes</span></div>
  </div>
</section>
<script type="module" src="./index.js"></script>
</body>
</html>
