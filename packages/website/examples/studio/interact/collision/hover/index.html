<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hover-to-Highlight via SceneCollisionIndex BVH</title>
    <link href="../../../../../css/example-page.css" rel="stylesheet"/>
    <style>
        body {
            background-color: white;
            overflow: hidden;
            margin: 0;
            user-select: none;
        }

        #demoCanvas {
            width: 100%;
            height: 100%;
            position: absolute;
            background: white;
            border: 0;
        }

        #hoverStatus {
            position: absolute;
            top: 120px;
            left: 12px;
            padding: 10px 14px;
            background: rgba(15, 17, 22, 0.85);
            color: #e7e7e7;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            line-height: 1.45;
            border-radius: 8px;
            pointer-events: none;
            min-width: 220px;
        }

        #hoverStatus .label   { color: #aaa; }
        #hoverStatus .value   { color: #ffe7b3; }
        #hoverStatus .number  { color: #b3e6c7; }
        #hoverStatus .nohit   { color: #888; font-style: italic; }
    </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="hoverStatus">
    <div><span class="label">Object:&nbsp;</span><span id="hoverObjectId" class="nohit">— move mouse over model —</span></div>
    <div><span class="label">Hits along ray:&nbsp;</span><span id="hoverHitCount" class="number">0</span></div>
    <div><span class="label">BVH size:&nbsp;</span><span id="hoverBvhSize" class="number">0</span></div>
    <div><span class="label">Last query:&nbsp;</span><span id="hoverQueryUs" class="number">0</span> µs</div>
</div>
</body>
<script type="module" src="./index.js"></script>
</html>
