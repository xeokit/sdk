<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Walk Navigation Interior</title>
    <link rel="icon" href="data:,">
    <link href="../../../../css/example-page.css" rel="stylesheet"/>
    <style>
        body {
            background: #e4e8ec;
            overflow: hidden;
            margin: 0;
            user-select: none;
        }

        #demoCanvas {
            width: 100%;
            height: 100%;
            position: absolute;
            background: #e4e8ec;
            border: 0;
        }

        #status {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
            padding: 8px 10px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.9);
            color: #1f2933;
            font: 13px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            box-shadow: 0 1px 6px rgba(15, 23, 42, 0.16);
        }

        .xkt-info-panel,
        .xkt-info-pill {
            display: none !important;
        }
    </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="status">Loading OTC Conference Center walk navigation demo...</div>
</body>
<script type="module" src="./index.js"></script>
</html>
