<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebGL + WebGPU - Material Feature Parity</title>
    <link rel="icon" href="data:,">
    <link href="../../../../css/example-page.css" rel="stylesheet"/>
    <style>
        html,
        body {
            --toolbar-height: 132px;
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #172033;
            color: #111827;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #modeBar {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: var(--toolbar-height);
            padding: 9px 14px 9px 148px;
            box-sizing: border-box;
            background: rgba(248, 250, 252, 0.96);
            border-bottom: 1px solid rgba(15, 23, 42, 0.18);
            color: #111827;
        }

        #modeTitle {
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
        }

        #controlStack {
            display: flex;
            flex: 1 1 auto;
            flex-direction: column;
            gap: 7px;
            min-width: 0;
        }

        .controlRow {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            min-width: 0;
        }

        #probeLegend {
            display: flex;
            flex: 0 1 auto;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 5px;
            max-width: min(44vw, 680px);
            min-width: 180px;
        }

        .probe-chip {
            display: inline-flex;
            align-items: center;
            height: 22px;
            padding: 0 7px;
            border-radius: 4px;
            background: rgba(15, 23, 42, 0.08);
            color: #334155;
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
        }

        .controlRow button {
            height: 32px;
            padding: 0 11px;
            border: 1px solid rgba(15, 23, 42, 0.24);
            border-radius: 4px;
            background: #ffffff;
            color: #111827;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0;
            cursor: pointer;
        }

        .controlRow button[aria-pressed="true"] {
            border-color: #0f766e;
            background: #0f766e;
            color: #ffffff;
        }

        #featureControls button[data-preset] {
            border-color: rgba(51, 65, 85, 0.28);
            background: #eef2f7;
        }

        body.is-reconfiguring .controlRow button {
            cursor: wait;
            opacity: 0.72;
        }

        #layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            width: 100%;
            height: 100%;
            padding-top: var(--toolbar-height);
            box-sizing: border-box;
        }

        .viewport {
            position: relative;
            min-width: 0;
            min-height: 0;
            border-right: 1px solid rgba(15, 23, 42, 0.35);
        }

        .viewport:last-child {
            border-right: 0;
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #f5f7fa;
        }

        .label {
            justify-self: center;
            padding: 7px 11px;
            border-radius: 4px;
            background: rgba(2, 6, 23, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: 0;
            pointer-events: none;
        }

        #rendererLabels {
            position: fixed;
            left: 0;
            right: 0;
            top: calc(var(--toolbar-height) + 14px);
            z-index: 100030;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            pointer-events: none;
        }

        .status {
            position: absolute;
            left: 14px;
            bottom: 14px;
            z-index: 2;
            max-width: min(440px, calc(100% - 28px));
            padding: 8px 10px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(15, 23, 42, 0.18);
            color: #172033;
            font-size: 12px;
            line-height: 1.35;
            pointer-events: none;
        }

        .status[data-state="error"] {
            border-color: rgba(185, 28, 28, 0.5);
            color: #7f1d1d;
        }

        .status[data-state="warn"] {
            border-color: rgba(180, 83, 9, 0.45);
            color: #78350f;
        }

        @media (max-width: 780px) {
            body {
                --toolbar-height: 244px;
            }

            #modeBar {
                align-items: flex-start;
                flex-direction: column;
                gap: 7px;
            }

            #probeLegend {
                display: none;
            }

            #layout {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
            }

            #rendererLabels {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
                height: calc(100vh - var(--toolbar-height));
                align-items: start;
            }

            .viewport {
                border-right: 0;
                border-bottom: 1px solid rgba(15, 23, 42, 0.35);
            }
        }
    </style>
</head>
<body>
<header id="modeBar">
    <div id="modeTitle">Material parity</div>
    <div id="controlStack">
        <div id="modeControls" class="controlRow" aria-label="Material parity mode"></div>
        <div id="featureControls" class="controlRow" aria-label="Shared material feature controls"></div>
    </div>
    <div id="probeLegend" aria-label="Material probes"></div>
</header>
<div id="rendererLabels" aria-hidden="true">
    <div class="label">WebGL</div>
    <div class="label">WebGPU</div>
</div>
<div id="layout">
    <section id="webglViewport" class="viewport">
        <canvas id="webglCanvas"></canvas>
        <div id="webglStatus" class="status" data-state="ok">Starting WebGL.</div>
    </section>
    <section id="webgpuViewport" class="viewport">
        <canvas id="webgpuCanvas"></canvas>
        <div id="webgpuStatus" class="status" data-state="warn">Starting WebGPU.</div>
    </section>
</div>
<script type="module" src="./index.js"></script>
</body>
</html>
