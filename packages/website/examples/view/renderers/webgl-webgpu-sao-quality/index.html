<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebGL + WebGPU - SAO Quality</title>
    <link rel="icon" href="data:,">
    <link href="../../../../css/example-page.css" rel="stylesheet"/>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #111827;
            color: #111827;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #saoBar {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 74px;
            padding: 9px 12px;
            box-sizing: border-box;
            background: rgba(248, 250, 252, 0.96);
            border-bottom: 1px solid rgba(15, 23, 42, 0.2);
            color: #172033;
        }

        #saoTitle {
            flex: 0 0 auto;
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
        }

        #saoControls {
            display: flex;
            flex: 1 1 auto;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 10px;
            min-width: 0;
        }

        .control {
            display: grid;
            grid-template-columns: auto minmax(62px, 112px) 36px;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
        }

        .control input,
        .control select {
            min-width: 0;
        }

        .control output {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            color: #475569;
        }

        .toggle {
            height: 30px;
            padding: 0 10px;
            border: 1px solid rgba(15, 23, 42, 0.24);
            border-radius: 4px;
            background: #fff;
            color: #172033;
            font: inherit;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .toggle[aria-pressed="true"] {
            border-color: #1f5f99;
            background: #1f5f99;
            color: #fff;
        }

        #layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            width: 100%;
            height: 100%;
            padding-top: 74px;
            box-sizing: border-box;
        }

        .viewport {
            position: relative;
            min-width: 0;
            min-height: 0;
            border-right: 1px solid rgba(15, 23, 42, 0.35);
        }

        .viewport:last-child {
            border-right: 0;
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #eef1f5;
        }

        .label {
            justify-self: center;
            padding: 7px 11px;
            border-radius: 4px;
            background: rgba(2, 6, 23, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #fff;
            font-size: 15px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: 0;
            pointer-events: none;
        }

        #rendererLabels {
            position: fixed;
            left: 0;
            right: 0;
            top: 88px;
            z-index: 100030;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            pointer-events: none;
        }

        .status {
            position: absolute;
            left: 14px;
            bottom: 14px;
            z-index: 2;
            max-width: min(440px, calc(100% - 28px));
            padding: 8px 10px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(15, 23, 42, 0.18);
            color: #172033;
            font-size: 12px;
            line-height: 1.35;
            pointer-events: none;
        }

        .status[data-state="error"] {
            border-color: rgba(185, 28, 28, 0.5);
            color: #7f1d1d;
        }

        .status[data-state="warn"] {
            border-color: rgba(180, 83, 9, 0.45);
            color: #78350f;
        }

        @media (max-width: 900px) {
            #saoBar {
                min-height: 116px;
                align-items: flex-start;
                flex-direction: column;
                gap: 7px;
            }

            #layout {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
                padding-top: 116px;
            }

            #rendererLabels {
                top: 130px;
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
                height: calc(100vh - 116px);
                align-items: start;
            }

            .viewport {
                border-right: 0;
                border-bottom: 1px solid rgba(15, 23, 42, 0.35);
            }
        }
    </style>
</head>
<body>
<header id="saoBar">
    <div id="saoTitle">SAO quality</div>
    <div id="saoControls" aria-label="Shared SAO controls"></div>
</header>
<div id="rendererLabels" aria-hidden="true">
    <div class="label">WebGL</div>
    <div class="label">WebGPU</div>
</div>
<div id="layout">
    <section id="webglViewport" class="viewport">
        <canvas id="webglCanvas"></canvas>
        <div id="webglStatus" class="status" data-state="ok">Starting WebGL.</div>
    </section>
    <section id="webgpuViewport" class="viewport">
        <canvas id="webgpuCanvas"></canvas>
        <div id="webgpuStatus" class="status" data-state="warn">Starting WebGPU.</div>
    </section>
</div>
<script type="module" src="index.js"></script>
</body>
</html>
