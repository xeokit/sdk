<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebGL + WebGPU - Transparency Quality</title>
    <link rel="icon" href="data:,">
    <link href="../../../../css/example-page.css" rel="stylesheet"/>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #172033;
            color: #111827;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            width: 100%;
            height: 100%;
            padding-top: 54px;
            box-sizing: border-box;
        }

        #modeBar {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            min-height: 54px;
            padding: 9px 14px;
            box-sizing: border-box;
            background: rgba(248, 250, 252, 0.96);
            border-bottom: 1px solid rgba(15, 23, 42, 0.18);
            color: #111827;
        }

        #modeTitle {
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
        }

        #modeControls {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            min-width: 0;
        }

        #modeControls button {
            height: 32px;
            padding: 0 11px;
            border: 1px solid rgba(15, 23, 42, 0.24);
            border-radius: 4px;
            background: #ffffff;
            color: #111827;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0;
            cursor: pointer;
        }

        #modeControls button[aria-pressed="true"] {
            border-color: #0f766e;
            background: #0f766e;
            color: #ffffff;
        }

        .viewport {
            position: relative;
            min-width: 0;
            min-height: 0;
            border-right: 1px solid rgba(15, 23, 42, 0.35);
        }

        .viewport:last-child {
            border-right: 0;
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #f5f7fa;
        }

        .label {
            position: absolute;
            left: 14px;
            top: 14px;
            z-index: 2;
            padding: 7px 11px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(15, 23, 42, 0.2);
            color: #020617;
            font-size: 15px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: 0;
            pointer-events: none;
        }

        .status {
            position: absolute;
            left: 14px;
            bottom: 14px;
            z-index: 2;
            max-width: min(440px, calc(100% - 28px));
            padding: 8px 10px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(15, 23, 42, 0.18);
            color: #172033;
            font-size: 12px;
            line-height: 1.35;
            pointer-events: none;
        }

        .status[data-state="error"] {
            border-color: rgba(185, 28, 28, 0.5);
            color: #7f1d1d;
        }

        .status[data-state="warn"] {
            border-color: rgba(180, 83, 9, 0.45);
            color: #78350f;
        }

        @media (max-width: 780px) {
            #layout {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
            }

            .viewport {
                border-right: 0;
                border-bottom: 1px solid rgba(15, 23, 42, 0.35);
            }
        }
    </style>
</head>
<body>
<header id="modeBar">
    <div id="modeTitle">Transparency quality</div>
    <div id="modeControls" aria-label="Transparency quality mode"></div>
</header>
<div id="layout">
    <section id="webglViewport" class="viewport">
        <canvas id="webglCanvas"></canvas>
        <div class="label">WebGL</div>
        <div id="webglStatus" class="status" data-state="ok">Starting WebGL.</div>
    </section>
    <section id="webgpuViewport" class="viewport">
        <canvas id="webgpuCanvas"></canvas>
        <div class="label">WebGPU</div>
        <div id="webgpuStatus" class="status" data-state="warn">Starting WebGPU.</div>
    </section>
</div>
<script type="module" src="./index.js"></script>
</body>
</html>
