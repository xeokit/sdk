<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Render Path Matrix</title>
    <link href="../../../../css/example-page.css" rel="stylesheet"/>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #f5f5f3;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body.is-reconfiguring,
        body.is-reconfiguring * {
            cursor: wait !important;
        }

        #demoCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 0;
        }

        body:not(.xeokit-loading-spinner-ready)::after,
        #xeokit-boot-loading-overlay,
        .xeokit-loading-overlay {
            display: none !important;
        }

        #diagnosticPanel {
            position: fixed;
            left: 12px;
            top: 12px;
            z-index: 2147483647;
            isolation: isolate;
            width: min(380px, calc(100vw - 24px));
            max-height: calc(100vh - 24px);
            overflow: auto;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(0, 0, 0, 0.18);
            border-radius: 6px;
            box-shadow: 0 8px 26px rgba(0, 0, 0, 0.18);
            padding: 12px;
            color: #1f2933;
            font-size: 13px;
        }

        #diagnosticPanel h1 {
            margin: 0 0 8px;
            font-size: 15px;
            line-height: 1.2;
        }

        #diagnosticPanel .gallery-link {
            float: right;
            margin: 0 0 4px 8px;
            padding: 3px 6px;
            color: #123a5d;
            background: #e5edf5;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
        }

        #diagnosticPanel code {
            display: block;
            margin: 6px 0 10px;
            padding: 6px;
            white-space: normal;
            word-break: break-word;
            background: #eef2f5;
            border-radius: 4px;
            font-size: 12px;
        }

        #diagnosticPanel a {
            display: inline-block;
            margin: 2px 4px 2px 0;
            padding: 3px 6px;
            color: #123a5d;
            background: #e5edf5;
            border-radius: 4px;
            text-decoration: none;
        }

        #diagnosticPanel a.is-active {
            color: #fff;
            background: #235b91;
        }

        #diagnosticPanel dl {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 4px 8px;
            margin: 8px 0;
        }

        #diagnosticPanel dt {
            font-weight: 650;
        }

        #diagnosticPanel dd {
            margin: 0;
        }

        #diagnosticPanel .choice-row {
            min-width: 0;
        }

        #diagnosticPanel .material-select {
            width: 100%;
            min-height: 28px;
            padding: 3px 6px;
            color: #1f2933;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            font: inherit;
        }

        #diagnosticPanel .render-path-error {
            margin: 0 0 8px;
            padding: 6px;
            color: #7f1d1d;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.35;
        }

        #captureSummary {
            position: fixed;
            left: 14px;
            top: 14px;
            z-index: 2147483646;
            max-width: min(520px, calc(100vw - 28px));
            padding: 8px 10px;
            border: 1px solid rgba(15, 23, 42, 0.18);
            border-radius: 6px;
            background: rgba(248, 250, 252, 0.88);
            color: #0f172a;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.12);
            font-size: 12px;
            line-height: 1.35;
            pointer-events: none;
        }

        #captureSummary .capture-title {
            font-weight: 700;
        }

        #captureSummary .capture-effects {
            margin-top: 2px;
            color: #334155;
        }
    </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="captureSummary" aria-hidden="true"></div>
<div id="diagnosticPanel">
    <h1><a class="gallery-link" href="../render-path-matrix-gallery/">Gallery</a>Render Path Matrix</h1>
    <div id="summary"></div>
</div>
</body>
<script type="module" src="./index.js?v=live-update"></script>
</html>
