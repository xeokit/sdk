<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebGPU Renderer RTC Tiles</title>
    <link rel="icon" href="data:,">
    <link href="../../../../css/example-page.css" rel="stylesheet"/>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #0b1220;
            color: #e5eefc;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        #demoCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #0b1220;
        }

        #panel {
            position: absolute;
            left: 16px;
            top: 16px;
            z-index: 2;
            width: min(480px, calc(100vw - 32px));
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid rgba(148, 163, 184, 0.28);
            background: rgba(15, 23, 42, 0.88);
            color: #dbeafe;
            font-size: 13px;
            line-height: 1.45;
        }

        #panel strong {
            display: block;
            margin-bottom: 8px;
            color: #f8fafc;
            font-size: 14px;
        }

        #panel span {
            display: block;
        }

        #panel code {
            color: #fde68a;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 12px;
        }

        #controls {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            margin: 12px 0;
        }

        button {
            min-height: 34px;
            border: 1px solid rgba(147, 197, 253, 0.38);
            background: rgba(30, 64, 175, 0.58);
            color: #eff6ff;
            font: inherit;
            cursor: pointer;
        }

        button:hover,
        button[data-active="true"] {
            background: rgba(59, 130, 246, 0.72);
        }

        #panel[data-state="error"] {
            border-color: rgba(248, 113, 113, 0.7);
            color: #fecaca;
        }
    </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="panel">
    <strong>WebGPU Renderer RTC Tiles</strong>
    <span id="status">Initializing...</span>
    <div id="controls"></div>
    <div id="details"></div>
</div>
</body>
<script type="module" src="./index.js"></script>
</html>
