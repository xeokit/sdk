<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebGPU Renderer - Section Planes</title>
    <link href="../../../../css/example-page.css" rel="stylesheet"/>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #101820;
            color: #e5e7eb;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #demoCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #101820;
        }

        #panel {
            position: absolute;
            left: 16px;
            top: 16px;
            z-index: 4;
            width: min(360px, calc(100vw - 32px));
            padding: 12px 14px;
            border: 1px solid rgba(148, 163, 184, 0.38);
            background: rgba(16, 24, 32, 0.88);
            color: #e5e7eb;
            font-size: 13px;
            line-height: 1.45;
        }

        #panel strong {
            display: block;
            margin-bottom: 8px;
            color: #ffffff;
            font-size: 14px;
        }

        #panel label {
            display: grid;
            gap: 6px;
            margin-top: 10px;
        }

        #panel input[type="range"] {
            width: 100%;
        }

        #panel code {
            color: #fed7aa;
        }

        #panel[data-state="error"] {
            border-color: rgba(248, 113, 113, 0.65);
            color: #fecaca;
        }
    </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="panel">
    <strong>WebGPU Section Planes</strong>
    <span id="status">Initializing...</span>
    <label>
        <span>Cut position <code id="cutValue">0.0</code></span>
        <input id="cutSlider" type="range" min="-6" max="6" step="0.1" value="0">
    </label>
    <label>
        <span><input id="activeToggle" type="checkbox" checked> Active section plane</span>
    </label>
    <label>
        <span><input id="capsToggle" type="checkbox" checked> Show cap color</span>
    </label>
    <label>
        <span><input id="legToggle" type="checkbox"> Yellow leg ignores clipping</span>
    </label>
</div>
</body>
<script type="module" src="./index.js"></script>
</html>
