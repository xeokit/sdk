<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebGPU Renderer - Triangle Depth Demo</title>
    <link href="../../../../css/example-page.css" rel="stylesheet"/>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #111827;
            color: #e5e7eb;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #demoCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #111827;
        }

        #status {
            position: absolute;
            left: 16px;
            top: 16px;
            z-index: 2;
            max-width: 520px;
            padding: 12px 14px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            background: rgba(15, 23, 42, 0.82);
            color: #e5e7eb;
            font-size: 13px;
            line-height: 1.45;
        }

        #status strong {
            display: block;
            margin-bottom: 4px;
            color: #ffffff;
            font-size: 14px;
        }

        #status[data-state="error"] {
            border-color: rgba(248, 113, 113, 0.65);
            color: #fecaca;
        }
    </style>
</head>
<body>
<canvas id="demoCanvas"></canvas>
<div id="status"><strong>WebGPU Renderer</strong><span>Initializing...</span></div>
</body>
<script type="module" src="./index.js"></script>
</html>
