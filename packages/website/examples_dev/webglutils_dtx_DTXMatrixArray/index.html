<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DTXMatrixArray WebGL2 Test</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body{height:100%;margin:0;background:#0b0d12;color:#d8e0ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    #wrap{display:flex;gap:16px;align-items:flex-start;padding:12px}
    #controls{width:320px;background:#111520;border:1px solid #1c2233;border-radius:12px;padding:12px}
    #controls h1{font-size:16px;margin:0 0 8px;color:#a8b3ff}
    #controls button{margin:6px 6px 0 0;padding:8px 10px;border-radius:8px;border:1px solid #26304a;background:#151b2b;color:#e7ecff;cursor:pointer}
    #controls button:hover{background:#1a2236}
    #info{font:12px/1.4 monospace;color:#a4b1ff;margin-top:8px;white-space:pre-wrap}
    canvas{flex:1;display:block;height:80vh;border:1px solid #1c2233;border-radius:12px;background:#0b0e18}
  </style>
</head>
<body>
<div id="wrap">
  <div id="controls">
    <h1>DTXMatrixArray — RGBA32F mat4 texture</h1>
    <div>
      <button id="toggleAnim">Toggle Anim</button>
      <button id="randomizeOne">Randomize One</button>
      <button id="randomizeAll">Randomize All</button>
      <button id="flushNow">Flush Now</button>
    </div>
    <div id="info"></div>
  </div>
  <canvas id="c"></canvas>
</div>

<script type="module">
  'use strict';

  /* ========= Minimal JS port of the provided DTXMatrixArray (WebGL2) ========= */

  class DTXMatrixArray {
    /** @param {{gl: WebGL2RenderingContext, maxMatrices?: number}} params */
    constructor(params){
      this.gl = params.gl;
      this.maxMatrices = params.maxMatrices ?? 2000;
      this.dirtyIndices = new Set();
      this.#allocateTexture();
    }

    // Allocation: each mat4 = 4 texels (RGBA32F). Texture width is 512 matrices/row * 4 = 2048 texels.
    #allocateTexture(){
      const gl = this.gl;
      const matricesPerRow = 512;
      const texelsPerMatrix = 4;
      const componentsPerTexel = 4;

      this.textureWidth  = matricesPerRow * texelsPerMatrix;      // 2048 texels wide
      const textureHeight = Math.ceil(this.maxMatrices / matricesPerRow);

      // Backing buffer (column-major per mat4, 16 floats)
      const requiredFloats = this.textureWidth * textureHeight * componentsPerTexel; // width*height*4
      this.buffer = new Float32Array(requiredFloats);

      const tex = gl.createTexture();
      if(!tex) throw new Error('Failed to create texture');
      this.texture = tex;

      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
      gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32F, this.textureWidth, textureHeight); // immutable storage
      // initialize with zeros
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, this.textureWidth, textureHeight, gl.RGBA, gl.FLOAT, this.buffer, 0);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.bindTexture(gl.TEXTURE_2D, null);
    }

    /** Column-major mat4 (Float32Array length 16) */
    setMatrix(index, matrix){
      this.buffer.set(matrix, index * 16);
      this.dirtyIndices.add(index);
    }

    /** Row-aligned, coalesced partial uploads */
    flush(){
      if(this.dirtyIndices.size === 0) return;
      const gl = this.gl;

      gl.bindTexture(gl.TEXTURE_2D, this.texture);
      gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);

      const matricesPerRow = this.textureWidth / 4; // 4 texels per matrix
      const sorted = Array.from(this.dirtyIndices).sort((a,b)=>a-b);

      let start = sorted[0], end = start;
      const pushRun = (s,e)=>{
        const row   = Math.floor(s / matricesPerRow);
        const col   = (s % matricesPerRow) * 4; // texel x
        const count = e - s + 1;
        const off   = s * 16;
        gl.texSubImage2D(
          gl.TEXTURE_2D, 0,
          col, row,
          count * 4, 1,              // width = 4 texels per matrix
          gl.RGBA, gl.FLOAT,
          this.buffer.subarray(off, off + count*16)
        );
      };

      for(let i=1;i<=sorted.length;i++){
        const cur = sorted[i];
        const sameRow = cur!==undefined &&
          Math.floor(cur / matricesPerRow) === Math.floor(end / matricesPerRow);
        const contiguous = cur === end + 1;

        if(contiguous && sameRow){
          end = cur;
        } else {
          pushRun(start, end);
          start = cur;
          end   = cur;
        }
      }

      gl.bindTexture(gl.TEXTURE_2D, null);
      this.dirtyIndices.clear();
    }

    destroy(){ this.gl.deleteTexture(this.texture); }
  }

  /* ============================ WebGL2 demo app ============================ */

  const canvas = document.getElementById('c');
  const infoEl = document.getElementById('info');
  const gl = canvas.getContext('webgl2');
  if(!gl){ alert('WebGL2 required'); throw new Error('WebGL2 not supported'); }

  // Basic shaders: read mat4 from RGBA32F texture in the VERTEX SHADER.
  // Each matrix occupies 4 consecutive texels (columns) in a 2D atlas.

  const VS = `#version 300 es
precision highp float;

uniform sampler2D uMatrixTex;

out vec3 vColor;

mat4 fetchMatrix(uint index){
  int texW = textureSize(uMatrixTex, 0).x; // texels (columns)
  int baseX = int((index * 4u) % uint(texW));
  int y     = int((index * 4u) / uint(texW));

  // columns (mat4 expects column vectors)
  vec4 c0 = texelFetch(uMatrixTex, ivec2(baseX + 0, y), 0);
  vec4 c1 = texelFetch(uMatrixTex, ivec2(baseX + 1, y), 0);
  vec4 c2 = texelFetch(uMatrixTex, ivec2(baseX + 2, y), 0);
  vec4 c3 = texelFetch(uMatrixTex, ivec2(baseX + 3, y), 0);
  return mat4(c0,c1,c2,c3);
}

void main(){
  uint vid = uint(gl_VertexID);
  uint inst = vid / 3u;       // one triangle = 3 verts
  uint v    = vid % 3u;

  // base triangle in local space
  vec2 p;
  if (v==0u) p = vec2(-0.35, -0.25);
  else if(v==1u) p = vec2( 0.35, -0.25);
  else           p = vec2( 0.00,  0.45);

  mat4 M = fetchMatrix(inst);
  vec4 pos = M * vec4(p, 0.0, 1.0);

  // encode color from instance id (nice gradient)
  float t = fract(float(inst) * 0.12345);
  vColor = vec3(0.5 + 0.5*sin(6.2831*vec3(t, t+0.33, t+0.66)));

  gl_Position = pos;
}
`;

  const FS = `#version 300 es
precision highp float;
in vec3 vColor;
out vec4 outColor;
void main(){
  outColor = vec4(vColor, 1.0);
}
`;

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
      console.error(src);
      throw new Error(gl.getShaderInfoLog(s) || 'shader compile error');
    }
    return s;
  }
  function programFrom(vs, fs){
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
      throw new Error(gl.getProgramInfoLog(p) || 'link error');
    }
    return p;
  }

  const prog = programFrom(VS, FS);
  gl.useProgram(prog);
  const loc = {
    uMatrixTex: gl.getUniformLocation(prog, 'uMatrixTex'),
  };

  // Dummy VAO (required on some drivers)
  gl.bindVertexArray(gl.createVertexArray());

  // Scene: grid of instances, each instance = 1 triangle (3 verts)
  const COLS = 12, ROWS = 8;
  const INSTANCES = COLS * ROWS;

  // Create matrix texture
  const dtx = new DTXMatrixArray({ gl, maxMatrices: INSTANCES });

  // --------- Mat4 helpers (column-major) ----------
  function mat4Identity(){
    const m = new Float32Array(16);
    m[0]=1; m[5]=1; m[10]=1; m[15]=1;
    return m;
  }
  function mat4Mul(out,a,b){
    const a00=a[0], a01=a[1], a02=a[2], a03=a[3];
    const a10=a[4], a11=a[5], a12=a[6], a13=a[7];
    const a20=a[8], a21=a[9], a22=a[10],a23=a[11];
    const a30=a[12],a31=a[13],a32=a[14],a33=a[15];
    let b0,b1,b2,b3;

    b0=b[0]; b1=b[1]; b2=b[2]; b3=b[3];
    out[0]=a00*b0+a10*b1+a20*b2+a30*b3;
    out[1]=a01*b0+a11*b1+a21*b2+a31*b3;
    out[2]=a02*b0+a12*b1+a22*b2+a32*b3;
    out[3]=a03*b0+a13*b1+a23*b2+a33*b3;

    b0=b[4]; b1=b[5]; b2=b[6]; b3=b[7];
    out[4]=a00*b0+a10*b1+a20*b2+a30*b3;
    out[5]=a01*b0+a11*b1+a21*b2+a31*b3;
    out[6]=a02*b0+a12*b1+a22*b2+a32*b3;
    out[7]=a03*b0+a13*b1+a23*b2+a33*b3;

    b0=b[8]; b1=b[9]; b2=b[10]; b3=b[11];
    out[8]=a00*b0+a10*b1+a20*b2+a30*b3;
    out[9]=a01*b0+a11*b1+a21*b2+a31*b3;
    out[10]=a02*b0+a12*b1+a22*b2+a32*b3;
    out[11]=a03*b0+a13*b1+a23*b3+a33*b3; // (typo fixed below)
    return out;
  }
  // Fix a tiny slip above; re-define correctly:
  function mul(out,a,b){
    const a00=a[0], a01=a[1], a02=a[2], a03=a[3];
    const a10=a[4], a11=a[5], a12=a[6], a13=a[7];
    const a20=a[8], a21=a[9], a22=a[10],a23=a[11];
    const a30=a[12],a31=a[13],a32=a[14],a33=a[15];
    let b0,b1,b2,b3;

    b0=b[0]; b1=b[1]; b2=b[2]; b3=b[3];
    out[0]=a00*b0+a10*b1+a20*b2+a30*b3;
    out[1]=a01*b0+a11*b1+a21*b2+a31*b3;
    out[2]=a02*b0+a12*b1+a22*b2+a32*b3;
    out[3]=a03*b0+a13*b1+a23*b2+a33*b3;

    b0=b[4]; b1=b[5]; b2=b[6]; b3=b[7];
    out[4]=a00*b0+a10*b1+a20*b2+a30*b3;
    out[5]=a01*b0+a11*b1+a21*b2+a31*b3;
    out[6]=a02*b0+a12*b1+a22*b2+a32*b3;
    out[7]=a03*b0+a13*b1+a23*b2+a33*b3;

    b0=b[8]; b1=b[9]; b2=b[10]; b3=b[11];
    out[8]=a00*b0+a10*b1+a20*b2+a30*b3;
    out[9]=a01*b0+a11*b1+a21*b2+a31*b3;
    out[10]=a02*b0+a12*b1+a22*b2+a32*b3;
    out[11]=a03*b0+a13*b1+a23*b2+a33*b3;

    b0=b[12]; b1=b[13]; b2=b[14]; b3=b[15];
    out[12]=a00*b0+a10*b1+a20*b2+a30*b3;
    out[13]=a01*b0+a11*b1+a21*b2+a31*b3;
    out[14]=a02*b0+a12*b1+a22*b2+a32*b3;
    out[15]=a03*b0+a13*b1+a23*b2+a33*b3;
    return out;
  }
  function mat4Translate(tx,ty,tz){
    const m = mat4Identity();
    m[12]=tx; m[13]=ty; m[14]=tz;
    return m;
  }
  function mat4Scale(sx,sy,sz){
    const m = mat4Identity();
    m[0]=sx; m[5]=sy; m[10]=sz;
    return m;
  }
  function mat4RotateZ(rad){
    const c=Math.cos(rad), s=Math.sin(rad);
    const m = mat4Identity();
    m[0]=c; m[1]=s;
    m[4]=-s; m[5]=c;
    return m;
  }

  // Build initial grid of matrices in NDC
  const cellX = 2 / (COLS + 2);
  const cellY = 2 / (ROWS + 2);
  const baseScale = Math.min(cellX, cellY) * 0.9;

  function setInstanceMatrix(i, gx, gy, angle){
    const tx = -1 + cellX*(gx+1);
    const ty = -1 + cellY*(gy+1);
    const T = mat4Translate(tx, ty, 0);
    const S = mat4Scale(baseScale, baseScale, 1);
    const R = mat4RotateZ(angle);
    const RS = new Float32Array(16), TRS = new Float32Array(16);
    mul(RS, R, S);
    mul(TRS, T, RS);
    dtx.setMatrix(i, TRS);
  }

  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      const i = y*COLS + x;
      const a = (i / (COLS*ROWS)) * Math.PI; // gentle variation
      setInstanceMatrix(i, x, y, a);
    }
  }
  dtx.flush();

  // Bind texture unit 0 for sampling in VS
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, dtx.texture);
  gl.uniform1i(loc.uMatrixTex, 0);

  // GL state
  gl.disable(gl.DEPTH_TEST);
  gl.clearColor(0.03, 0.04, 0.08, 1);

  // Resize
  function resize(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = (canvas.clientWidth || (innerWidth - 360))|0;
    const h = (canvas.clientHeight || (innerHeight*0.8))|0;
    canvas.width = Math.floor(w*dpr);
    canvas.height= Math.floor(h*dpr);
    gl.viewport(0,0,canvas.width,canvas.height);
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  // UI
  let anim = true, tick = 0;
  document.getElementById('toggleAnim').onclick = ()=> anim = !anim;
  document.getElementById('flushNow').onclick   = ()=> { dtx.flush(); rebind(); };
  document.getElementById('randomizeOne').onclick = ()=>{
    const i = (Math.random()*INSTANCES)|0;
    const gx = i % COLS, gy = (i/COLS)|0;
    const a = Math.random()*Math.PI*2;
    setInstanceMatrix(i, gx, gy, a);
    dtx.flush(); rebind();
  };
  document.getElementById('randomizeAll').onclick = ()=>{
    for(let y=0;y<ROWS;y++){
      for(let x=0;x<COLS;x++){
        const i = y*COLS+x;
        const a = Math.random()*Math.PI*2;
        setInstanceMatrix(i, x, y, a);
      }
    }
    dtx.flush(); rebind();
  };

  // Re-bind after flush (since flush() unbinds in this implementation)
  function rebind(){
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, dtx.texture);
    gl.uniform1i(loc.uMatrixTex, 0);
  }

  function draw(){
    gl.clear(gl.COLOR_BUFFER_BIT);

    if (anim){
      // Animate ONE matrix per frame to exercise partial row-aligned updates
      const i = tick % INSTANCES;
      const gx = i % COLS, gy = (i/COLS)|0;
      const a = (tick * 0.05) % (Math.PI*2);
      setInstanceMatrix(i, gx, gy, a);
      dtx.flush(); rebind();
      tick++;
    }

    // N instances * 3 verts per instance
    gl.drawArrays(gl.TRIANGLES, 0, INSTANCES * 3);

    infoEl.textContent =
      `instances: ${INSTANCES}
texture size: ${dtx.textureWidth} x ${Math.ceil(INSTANCES / (dtx.textureWidth/4))}
dirty queued: ${dtx.dirtyIndices.size}
anim: ${anim ? 'on' : 'off'}`;

    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
