<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta content="IE=edge,chrome=1" http-equiv="X-UA-Compatible">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <title>xeokit Model Viewer</title>
  <link href="../css/pageStyle.css" rel="stylesheet"/>
</head>
<body style="background-color: white">
<canvas id="demoCanvas"></canvas>
</body>
<script type="module">

  import * as xeokit from "../js/xeokit-demo-bundle.js";
  import {DemoHelper} from "../js/DemoHelper.js";

  const reqParams = getRequestParams();
  const modelId = reqParams.modelId;
  const pipelineId = reqParams.pipelineId;
  const baseDir = `./${modelId}/${pipelineId}`;

  const formatLoaderClasses = {
    "XKT": xeokit.xkt.XKTLoader,
    "XGF": xeokit.xgf.XGFLoader,
    "glTF": xeokit.gltf.GLTFLoader,
    "CityJSON": xeokit.cityjson.CityJSONLoader,
    "IFC": xeokit.ifc.IFCLoader,
    "LAS": xeokit.las.LASLoader,
    "DotBIM": xeokit.dotbim.DotBIMLoader,
    "SceneModelParams": xeokit.scene.SceneModelParamsLoader,
    "DataModelParams": xeokit.data.DataModelParamsLoader
  };

  const formatLoaders = {};

  const demoHelper = new DemoHelper();

  const scene = new xeokit.scene.Scene();
  const data = new xeokit.data.Data();

  const renderer = new xeokit.webglrenderer.WebGLRenderer({});

  const viewer = new xeokit.viewer.Viewer({
    id: "demoViewer",
    scene,
    renderer
  });

  const view = viewer.createView({
    id: "demoView",
    elementId: "demoCanvas"
  });

  view.camera.orbitPitch(20);
  view.camera.orbitYaw(-40);

  new xeokit.cameracontrol.CameraControl(view, {});

  const cameraFlight = new xeokit.cameraflight.CameraFlightAnimation(view);

  demoHelper.init({})
    .then(() => {

      fetch(`${baseDir}/xeoconvert-manifest-report.json`).then(response => {
        response.json()
          .then(xeoconvertManifestReport => {

            async function fetchModelFiles() {

              const fetchEntries = xeoconvertManifestReport.files.map((fileInfo) => {

                const url = baseDir + "/" + fileInfo.filePath;
                const type = fileInfo.fileDataType;
                const format = fileInfo.fileFormat;
                const version = fileInfo.fileFormatVersion;
                const options = fileInfo.options;

                const sceneModelId = fileInfo.sceneModel || "default";
                const dataModelId = fileInfo.dataModel || "defaut";

                const sceneModel = scene.models[sceneModelId] || scene.createModel({id: sceneModelId});
                const dataModel = data.models[dataModelId] || data.createModel({id: dataModelId});

                return fetch(url)
                  .then(response => {
                    if (!response.ok) {
                      throw new Error(`Failed to fetch ${url}: ${response.statusText}`);
                    }
                    switch (type) {
                      case 'arraybuffer':
                        return response.arrayBuffer();
                      case 'json':
                        return response.json();
                      case 'text':
                        return response.text();
                      default:
                        throw new Error(`Unsupported fileDataType: ${type}`);
                    }
                  })
                  .then(fileData => {
                    let loader = formatLoaders[format];
                    if (!loader) {
                      const loaderClass = formatLoaderClasses[format];
                      if (!loaderClass) {
                        throw new Error(`Unsupported format: ${format}`);
                      }
                      loader = formatLoaders[format] = new loaderClass({});
                    }
                    return loader.load({
                      fileData,
                      version,
                      sceneModel,
                      dataModel,
                    }, options);
                  });
              });

              await Promise.all(fetchEntries);

              for (let sceneModelId in scene.models) {
                const sceneModel = scene.models[sceneModelId];
                if (!sceneModel.built) {
                  sceneModel.build();
                }
              }

              for (let dataModelId in data.models) {
                const dataModel = data.models[dataModelId];
                if (!dataModel.built) {
                  dataModel.build();
                }
              }

              cameraFlight.jumpTo({
                aabb: scene.aabb
              });

              demoHelper.finished();
            }

            return fetchModelFiles();
          });
      });
    });

  function getRequestParams() {
    const vars = {};
    window.location.href.replace(/[?&]+([^=&]+)=([^&]*)/gi, (m, key, value) => {
      vars[key] = value;
    });
    return vars;
  }

</script>

</html>
