<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta content="IE=edge,chrome=1" http-equiv="X-UA-Compatible">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <title>xeokit Model Viewer</title>
  <link href="../css/pageStyle.css" rel="stylesheet"/>
</head>
<body style="background-color: white">
<canvas id="demoCanvas"></canvas>
</body>
<script type="module">

  import * as xeokit from "../js/xeokit-demo-bundle.js";
  import {DemoHelper} from "../js/DemoHelper.js";

  const reqParams = getRequestParams();
  const modelId = reqParams.modelId;
  const pipelineId = reqParams.pipelineId;
  const baseDir = `./${modelId}/${pipelineId}`;

  const formatLoaderClasses = {
    "XKT": xeokit.formats.xkt.XKTLoader,
    "XGF": xeokit.formats.xgf.XGFLoader,
    "glTF": xeokit.formats.gltf.GLTFLoader,
    "CityJSON": xeokit.formats.cityjson.CityJSONLoader,
    "IFC": xeokit.formats.ifc.IFCLoader,
    "LAS": xeokit.formats.las.LASLoader,
    "DotBIM": xeokit.formats.dotbim.DotBIMLoader,
    "SceneModelParams": xeokit.formats.scenemodel.SceneModelParamsLoader,
    "DataModelParams": xeokit.formats.datamodel.DataModelParamsLoader
  };

  const formatLoaders = {};

  const demoHelper = new DemoHelper();

  demoHelper
    .init({
      logging: false
    })
    .then(({
             viewer,
             view,
             scene,
             data,
             renderer
           }) => {

      const cameraFlight = new xeokit.cameraflight.CameraFlightAnimation(view);

      fetch(`${baseDir}/xeoconvert-manifest-report.json`).then(response => {
        response.json()
          .then(xeoconvertManifestReport => {

            async function fetchModelFiles() {

              const fetchEntries = xeoconvertManifestReport.files.map((fileInfo) => {

                const url = baseDir + "/" + fileInfo.filePath;
                const type = fileInfo.fileDataType;
                const format = fileInfo.fileFormat;
                const version = fileInfo.fileFormatVersion;
                const options = fileInfo.options;

                const sceneModelId = fileInfo.sceneModel || "default";
                const dataModelId = fileInfo.dataModel || "defaut";

                let sceneModel = scene.models[sceneModelId];

                if (!sceneModel) {
                  const result = scene.createModel({
                    id: sceneModelId,
                    coordinateSystem: options.coordinateSystem
                  });
                  if (result.ok === false) {
                    throw new Error(`Failed to create scene model ${sceneModelId}: ${result.error}`);
                  }
                  sceneModel = result.value;
                }

                let dataModel = data.models[dataModelId];
                if (!dataModel) {
                  const result = data.createModel({id: dataModelId});
                  if (result.ok === false) {
                    throw new Error(`Failed to create data model ${dataModelId}: ${result.error}`);
                  }
                  dataModel = result.value;
                }

                return fetch(url)
                  .then(response => {
                    if (!response.ok) {
                      throw new Error(`Failed to fetch ${url}: ${response.statusText}`);
                    }
                    if (format === "IFC") { // HACK
                      return response.arrayBuffer();
                    } else {
                      switch (type) {
                        case 'arraybuffer':
                          return response.arrayBuffer();
                        case 'json':
                          return response.json();
                        case 'text':
                          return response.text();
                        default:
                          throw new Error(`Unsupported fileDataType: ${type}`);
                      }
                    }
                  })
                  .then(fileData => {

                    let loader = formatLoaders[format];

                    if (!loader) {
                      const loaderClass = formatLoaderClasses[format];
                      if (!loaderClass) {
                        throw new Error(`Unsupported format: ${format}`);
                      }
                      loader = new loaderClass({});
                      formatLoaders[format] = loader;
                    }

                    return loader.load({
                        fileData,
                        version,
                        sceneModel,
                        dataModel,
                      },
                      options);
                  });
              });

              await Promise.all(fetchEntries);

              // cameraFlight.jumpTo({
              //   aabb: scene.aabb
              // });

              demoHelper.finished();
            }

            return fetchModelFiles();
          });
      });
    });

  function getRequestParams() {
    const vars = {};
    window.location.href.replace(/[?&]+([^=&]+)=([^&]*)/gi, (m, key, value) => {
      vars[key] = value;
    });
    return vars;
  }

</script>

</html>
