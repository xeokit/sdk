    function resizeIframe() {
    }

    function stripLeadingSlashes(str) {
        return str.replace(/^\/+/, '');
    }

    function setIFrameToWindowHash() {
        const windowHash = window.location.hash;
        const i = windowHash.indexOf("___");
        let path;
        let hash;
        if (i === -1) {
            path = stripLeadingSlashes(windowHash.substring(1));
            hash = null;
        } else {
            path = stripLeadingSlashes(windowHash.substring(1, i));
            hash = windowHash.substring(i + 3);
        }
        console.log("path = " + path);
        console.log("hash = " + hash);

        if (hash && hash !== "") {
            const newSrc = `@@base/${path}#${hash}`;
            if (iframe.src !== newSrc) {
                iframe.src = newSrc;
                console.log("set iframe src : " + newSrc);
            }
        } else {
            const newSrc = (path && path !== "") ? `@@base/${path}` : `@@base/docs/api/modules.html`;
            if (iframe.src !== newSrc) {
                iframe.src = newSrc;
                console.log("set iframe src : " + newSrc);
                iframeWindow.scrollTo(0, 0);
                window.scrollTo(0, 0);
            }
        }
    }

    iframe.onload = () => {
        resizeIframe();
        const iframeHash = iframeWindow.location.hash.substring(1);
        if (iframeHash === "") {
            window.scrollTo(0, 0);
        iframeWindow.scrollTo(0, 0);
    }
        const newHash = iframeWindow.location.pathname + "___" + iframeHash;
        if (newHash !== window.location.hash.substring(1)) {
            console.log("save hash on window: " + newHash);
            window.location.hash = newHash;
        }
    };


     setIFrameToWindowHash();
     window.addEventListener('hashchange', setIFrameToWindowHash);

    iframeWindow.addEventListener('hashchange', ()=>{
        const iframeHash = iframeWindow.location.hash.substring(1);

            window.scrollTo(0, 0);
            iframeWindow.scrollTo(0, 0);

        if (newHash !== window.location.hash.substring(1)) {
            console.log("save hash on window: " + newHash);
            window.location.hash = newHash;
        }
    });
