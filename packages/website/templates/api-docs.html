<section id="intro" class=" alabaster">
    <div class="container-fluid">
        <div class="row iframe-container">
            <div class="col-12 p-0">
                <iframe id="autoIframe" src="@@base/docs/api" title="Content frame"></iframe>
            </div>
        </div>
    </div>
</section>
@@include('./footer.html', {
root: "@@base"
})
</body>
<script>

    const iframe = document.getElementById('autoIframe');
    const iframeWindow = iframe.contentWindow;

    iframe.style.height = "15000px";

    function resizeIframe() {
    }

    //setInterval(resizeIframe, 100);

    function stripLeadingSlashes(str) {
        return str.replace(/^\/+/, '');
    }

    function setIFrameToWindowHash() {
        const windowHash = window.location.hash;
        const i = windowHash.indexOf("___");
        let path;
        let hash;
        if (i === -1) {
            path = stripLeadingSlashes(windowHash.substring(1));
            hash = null;
        } else {
            path = stripLeadingSlashes(windowHash.substring(1, i));
            hash = windowHash.substring(i + 3);
        }

        if (hash && hash !== "") {
            const newSrc = `@@base/${path}#${hash}`;
            if (`@@base${iframeWindow.location.pathname}` !== newSrc) {
                iframe.src = newSrc;
            }
        } else {
            const newSrc = (path && path !== "") ? `@@base/${path}` : `@@base/docs/api/modules.html`;
            if (`@@base${iframeWindow.location.pathname}` !== newSrc) {
                iframe.src = newSrc;
                iframeWindow.scrollTo(0, 0);
                window.scrollTo(0, 0);
            }
        }
    }

    iframe.onload = () => {
        resizeIframe();

        // When serving from GH pages, the location.pathname is: "/sdk//docs/api/modules.html"
        // When serving locally, it is "/docs/api/modules.html"

        const iframeHash = iframeWindow.location.hash.substring(1);
        if (iframeHash === "") {
            window.scrollTo(0, 0);
        iframeWindow.scrollTo(0, 0);
    }
        const iFramePathName = iframeWindow.location.pathname;

        const newHash = iFramePathName.startsWith("/sdk/") ? iFramePathName.substring(5) : iFramePathName + "___" + iframeHash;
        if (newHash !== window.location.hash.substring(1)) {
            window.location.hash = newHash;
        }
    };


     setIFrameToWindowHash();
     window.addEventListener('hashchange', setIFrameToWindowHash);

    iframeWindow.addEventListener('hashchange', ()=>{
        const iframeHash = iframeWindow.location.hash.substring(1);
        if (iframeHash === "") {
            window.scrollTo(0, 0);
            iframeWindow.scrollTo(0, 0);
        }
        const iFramePathName = iframeWindow.location.pathname;
     //   const newHash = iframeWindow.location.pathname + "___" + iframeHash;
        const newHash = iFramePathName.startsWith("/sdk/") ? iFramePathName.substring(5) : iFramePathName + "___" + iframeHash;
        if (newHash !== window.location.hash.substring(1)) {
            window.location.hash = newHash;
        }
    });


</script>
</html>
